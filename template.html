<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KI-Lernreise: vom KI-Manager zu Claude Code</title>
<meta name="description" content="Interaktive Lern-App mit Gamification: KI-Grundlagen, Prompt Engineering, Automation, Voice Agents und Claude Code.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1f2328; --muted:#6b7280; --line:#e7e3da;
  --accent:#6d28d9; --accent-2:#8b5cf6; --good:#16a34a; --good-bg:#e8f7ee; --bad:#dc2626; --bad-bg:#fdecec;
  --gold:#f59e0b; --shadow:0 2px 0 rgba(0,0,0,.06), 0 8px 24px rgba(31,35,40,.06);
  --r:16px; --zc:#6d28d9;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14151a; --card:#1d1f26; --ink:#eceef2; --muted:#9aa1ad; --line:#2c2f39;
    --good-bg:#12301f; --bad-bg:#3a1717; --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
/* Top bar */
#top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:17px;white-space:nowrap}
.rankbox{flex:1;min-width:0}
.rankname{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.rankname span:last-child{color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pill{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:15px;white-space:nowrap}
.pill.streak.off{filter:grayscale(1);opacity:.55}
/* Layout */
main{max-width:760px;margin:0 auto;padding:18px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
h1,h2,h3{letter-spacing:-.02em;line-height:1.25}
h1{font-size:28px;margin:.2em 0 .4em}
h2{font-size:22px;margin:.2em 0 .5em}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font-weight:800;background:var(--accent);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 65%,#000);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.btn.zone{background:var(--zc);box-shadow:0 4px 0 color-mix(in srgb,var(--zc) 65%,#000)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.good{background:var(--good);box-shadow:0 4px 0 #0f6b30}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 #8f1717}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Hero */
.hero{display:flex;gap:16px;align-items:center;margin-bottom:22px}
.hero .big{font-size:46px;line-height:1}
.hero h1{margin:0;font-size:24px}
.overall{margin-top:8px}
/* Map */
.zone{margin:30px 0 12px}
.zhead{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:var(--r);color:#fff;background:var(--zc);box-shadow:0 4px 0 color-mix(in srgb,var(--zc) 60%,#000)}
.zhead .zi{font-size:34px}
.zhead h2{margin:0;font-size:19px;color:#fff}
.zhead p{margin:2px 0 0;font-size:13.5px;opacity:.92}
.zhead .zprog{margin-left:auto;text-align:right;font-weight:800;font-size:14px;white-space:nowrap}
.zone.locked .zhead{background:#9ca3af;box-shadow:0 4px 0 #6b7280}
.path{display:flex;flex-direction:column;align-items:center;padding:18px 0 6px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;margin:8px 0;width:160px}
.nbtn{width:74px;height:70px;border-radius:50%;border:0;font-size:30px;display:grid;place-items:center;background:var(--zc);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--zc) 60%,#000);transition:transform .1s}
.nbtn:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--zc) 60%,#000)}
.node.locked .nbtn{background:var(--line);color:var(--muted);box-shadow:0 6px 0 color-mix(in srgb,var(--line) 70%,#000);cursor:not-allowed;font-size:24px}
.node.next .nbtn{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 6px 0 color-mix(in srgb,var(--zc) 60%,#000),0 0 0 0 color-mix(in srgb,var(--zc) 55%,transparent)}70%{box-shadow:0 6px 0 color-mix(in srgb,var(--zc) 60%,#000),0 0 0 16px transparent}100%{box-shadow:0 6px 0 color-mix(in srgb,var(--zc) 60%,#000),0 0 0 0 transparent}}
.node.done .nbtn::after{content:"✓";position:absolute;top:-4px;right:38px;background:var(--gold);color:#fff;width:24px;height:24px;border-radius:50%;font-size:14px;font-weight:900;display:grid;place-items:center;border:2px solid var(--bg)}
.nlabel{font-size:13px;font-weight:700;text-align:center;margin-top:9px;line-height:1.25}
.node.locked .nlabel{color:var(--muted)}
.stars{font-size:13px;letter-spacing:1px;height:16px}
.start-tag{position:absolute;top:-30px;background:var(--card);border:2px solid var(--zc);color:var(--zc);font-weight:900;font-size:12px;padding:3px 10px;border-radius:10px;text-transform:uppercase;letter-spacing:.05em;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.bossnode .nbtn{width:92px;height:88px;font-size:44px;background:#111827;box-shadow:0 6px 0 #000}
/* Level */
.lvlhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.xbtn{border:0;background:transparent;font-size:24px;color:var(--muted);padding:4px 8px}
.steps{flex:1;display:flex;gap:6px}
.steps i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--zc)}
.hearts{font-size:20px;white-space:nowrap}
.hearts .lost{filter:grayscale(1);opacity:.3}
.lesson h4{margin:1.3em 0 .4em;font-size:17px}
.lesson p{margin:.6em 0}
.lesson ul,.lesson ol{padding-left:1.3em}
.lesson li{margin:.3em 0}
.lesson code,.lesson pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:color-mix(in srgb,var(--zc) 10%,var(--card));border-radius:6px}
.lesson code{padding:1px 6px}
.lesson pre{padding:12px 14px;overflow:auto;white-space:pre-wrap;border:1px solid var(--line)}
.tip,.ex{border-radius:12px;padding:12px 14px;margin:14px 0;font-size:15px}
.tip{background:color-mix(in srgb,var(--gold) 14%,var(--card));border-left:5px solid var(--gold)}
.tip::before{content:"💡 ";}
.ex{background:color-mix(in srgb,var(--zc) 9%,var(--card));border-left:5px solid var(--zc)}
.ex::before{content:"🎼 Beispiel: ";font-weight:800}
.keys{margin-top:18px;border:2px dashed color-mix(in srgb,var(--zc) 50%,var(--line));border-radius:14px;padding:12px 16px}
.keys b{display:block;margin-bottom:4px}
.keys li{margin:.25em 0}
.sticky-foot{position:sticky;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.card .sticky-foot{background:linear-gradient(color-mix(in srgb,var(--card) 0%,transparent),var(--card) 30%);margin:0 -2px}
/* Questions */
.qtype{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--zc)}
.qtext{font-size:20px;margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:600;transition:border-color .12s,background .12s}
.opt:hover{border-color:color-mix(in srgb,var(--zc) 55%,var(--line))}
.opt.sel{border-color:var(--zc);background:color-mix(in srgb,var(--zc) 10%,var(--card))}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{text-align:center;font-size:18px;padding:18px}
.pool,.answer{display:flex;flex-direction:column;gap:8px;min-height:52px}
.answer{border:2px dashed var(--line);border-radius:14px;padding:8px;margin-bottom:14px;counter-reset:ord}
.answer .chip{counter-increment:ord}
.answer .chip::before{content:counter(ord) ". ";font-weight:900;color:var(--zc)}
.answer:empty::before{content:"Tippe die Einträge unten in der richtigen Reihenfolge an";color:var(--muted);font-size:14px;padding:6px}
.chip{padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:600;text-align:left}
.chip.right{border-color:var(--good);background:var(--good-bg)}
.chip.wrong{border-color:var(--bad);background:var(--bad-bg)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-bottom:10px}
.mrow .ml{font-weight:700;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--zc) 9%,var(--card))}
select{font:inherit;width:100%;padding:11px 10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
select.right{border-color:var(--good);background:var(--good-bg)}
select.wrong{border-color:var(--bad);background:var(--bad-bg)}
@media (max-width:520px){.mrow{grid-template-columns:1fr;gap:6px;margin-bottom:16px}}
.feedback{margin-top:16px;border-radius:14px;padding:14px 16px}
.feedback.ok{background:var(--good-bg);border:2px solid var(--good)}
.feedback.no{background:var(--bad-bg);border:2px solid var(--bad)}
.feedback h4{margin:0 0 4px;font-size:18px}
.feedback .sol{font-weight:700;margin:6px 0}
.feedback p{margin:4px 0 12px}
/* Practice */
textarea{width:100%;min-height:130px;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.solution{white-space:pre-wrap;background:color-mix(in srgb,var(--good) 10%,var(--card));border-left:5px solid var(--good);border-radius:12px;padding:12px 14px;margin:12px 0}
.hint{background:color-mix(in srgb,var(--gold) 12%,var(--card));border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15px}
/* Result */
.result{text-align:center}
.result .big{font-size:64px;line-height:1.1}
.bigstars{font-size:40px;letter-spacing:6px;margin:8px 0}
.xplist{max-width:340px;margin:14px auto;text-align:left}
.xplist div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.xplist div:last-child{border:0;font-weight:900}
/* Stats & badges */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:26px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.badge .bi{font-size:38px}
.badge b{display:block;font-size:14px;margin-top:4px}
.badge small{color:var(--muted);font-size:12px;line-height:1.3;display:block;margin-top:2px}
.badge.locked .bi{filter:grayscale(1);opacity:.3}
.badge.locked b{color:var(--muted)}
.ranks{list-style:none;padding:0;margin:0}
.ranks li{display:flex;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.ranks li.cur{font-weight:900;color:var(--accent)}
.ranks li.future{color:var(--muted)}
.ranks .ri{font-size:24px;width:32px;text-align:center}
.ranks small{margin-left:auto;color:var(--muted)}
.section{margin-top:26px}
.toggle{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.toggle input{width:22px;height:22px;margin-top:2px}
/* Nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:transparent;padding:9px 4px 10px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button span{font-size:22px}
nav button.on{color:var(--accent)}
nav .cnt{position:absolute;top:4px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;line-height:18px}
/* Toast & modal */
#toasts{position:fixed;top:70px;left:0;right:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#111827;color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .35s ease-out, tout .4s ease-in 2.6s forwards}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}
@keyframes tout{to{transform:translateY(-14px);opacity:0}}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px}
#modal .card{max-width:420px;width:100%;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
#modal .big{font-size:72px;line-height:1.1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
/* Certificate */
.cert{position:relative;background:#fffdf7;color:#2b2414;border:10px double #b08d3c;border-radius:8px;padding:38px 28px;text-align:center;font-family:Georgia,"Times New Roman",serif}
.cert h1{font-size:36px;margin:.1em 0;color:#7a5c12;letter-spacing:.02em}
.cert .who{font-size:30px;font-style:italic;margin:14px 0;border-bottom:1px solid #b08d3c;display:inline-block;padding:0 24px 4px;min-width:60%}
.cert .seal{font-size:54px}
.cert ul{display:inline-block;text-align:left;margin:10px auto;font-size:15px}
.cert .foot{display:flex;justify-content:space-between;margin-top:26px;font-size:14px;gap:12px;flex-wrap:wrap}
.cert small{display:block;margin-top:18px;color:#7b6c4a;font-size:12px}
@media print{
  body *{visibility:hidden}
  #certprint, #certprint *{visibility:visible}
  #certprint{position:absolute;left:0;top:0;width:100%}
  nav,#top{display:none}
}
</style>
</head>
<body>
<header id="top"></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toasts"></div>
<canvas id="confetti"></canvas>
<script>
/*__CONTENT__*/
</script>
<script>
/*__APP__*/
</script>
</body>
</html>
