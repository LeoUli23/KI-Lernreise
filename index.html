<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KI-Lernreise: vom KI-Manager zu Claude Code</title>
<meta name="description" content="Interaktive Lern-App mit Gamification: KI-Grundlagen, Prompt Engineering, Automation, Voice Agents und Claude Code.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1f2328; --muted:#6b7280; --line:#e7e3da;
  --accent:#6d28d9; --accent-2:#8b5cf6; --good:#16a34a; --good-bg:#e8f7ee; --bad:#dc2626; --bad-bg:#fdecec;
  --gold:#f59e0b; --shadow:0 2px 0 rgba(0,0,0,.06), 0 8px 24px rgba(31,35,40,.06);
  --r:16px; --zc:#6d28d9;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14151a; --card:#1d1f26; --ink:#eceef2; --muted:#9aa1ad; --line:#2c2f39;
    --good-bg:#12301f; --bad-bg:#3a1717; --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
/* Top bar */
#top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:17px;white-space:nowrap}
.rankbox{flex:1;min-width:0}
.rankname{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.rankname span:last-child{color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pill{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:15px;white-space:nowrap}
.pill.streak.off{filter:grayscale(1);opacity:.55}
/* Layout */
main{max-width:760px;margin:0 auto;padding:18px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
h1,h2,h3{letter-spacing:-.02em;line-height:1.25}
h1{font-size:28px;margin:.2em 0 .4em}
h2{font-size:22px;margin:.2em 0 .5em}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font-weight:800;background:var(--accent);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 65%,#000);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.btn.zone{background:var(--zc);box-shadow:0 4px 0 color-mix(in srgb,var(--zc) 65%,#000)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.good{background:var(--good);box-shadow:0 4px 0 #0f6b30}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 #8f1717}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Hero */
.hero{display:flex;gap:16px;align-items:center;margin-bottom:22px}
.hero .big{font-size:46px;line-height:1}
.hero h1{margin:0;font-size:24px}
.overall{margin-top:8px}
/* Map */
.zone{margin:30px 0 12px}
.zhead{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:var(--r);color:#fff;background:var(--zc);box-shadow:0 4px 0 color-mix(in srgb,var(--zc) 60%,#000)}
.zhead .zi{font-size:34px}
.zhead h2{margin:0;font-size:19px;color:#fff}
.zhead p{margin:2px 0 0;font-size:13.5px;opacity:.92}
.zhead .zprog{margin-left:auto;text-align:right;font-weight:800;font-size:14px;white-space:nowrap}
.zone.locked .zhead{background:#9ca3af;box-shadow:0 4px 0 #6b7280}
.path{display:flex;flex-direction:column;align-items:center;padding:18px 0 6px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;margin:8px 0;width:160px}
.nbtn{width:74px;height:70px;border-radius:50%;border:0;font-size:30px;display:grid;place-items:center;background:var(--zc);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--zc) 60%,#000);transition:transform .1s}
.nbtn:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--zc) 60%,#000)}
.node.locked .nbtn{background:var(--line);color:var(--muted);box-shadow:0 6px 0 color-mix(in srgb,var(--line) 70%,#000);cursor:not-allowed;font-size:24px}
.node.next .nbtn{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 6px 0 color-mix(in srgb,var(--zc) 60%,#000),0 0 0 0 color-mix(in srgb,var(--zc) 55%,transparent)}70%{box-shadow:0 6px 0 color-mix(in srgb,var(--zc) 60%,#000),0 0 0 16px transparent}100%{box-shadow:0 6px 0 color-mix(in srgb,var(--zc) 60%,#000),0 0 0 0 transparent}}
.node.done .nbtn::after{content:"✓";position:absolute;top:-4px;right:38px;background:var(--gold);color:#fff;width:24px;height:24px;border-radius:50%;font-size:14px;font-weight:900;display:grid;place-items:center;border:2px solid var(--bg)}
.nlabel{font-size:13px;font-weight:700;text-align:center;margin-top:9px;line-height:1.25}
.node.locked .nlabel{color:var(--muted)}
.stars{font-size:13px;letter-spacing:1px;height:16px}
.start-tag{position:absolute;top:-30px;background:var(--card);border:2px solid var(--zc);color:var(--zc);font-weight:900;font-size:12px;padding:3px 10px;border-radius:10px;text-transform:uppercase;letter-spacing:.05em;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.bossnode .nbtn{width:92px;height:88px;font-size:44px;background:#111827;box-shadow:0 6px 0 #000}
/* Level */
.lvlhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.xbtn{border:0;background:transparent;font-size:24px;color:var(--muted);padding:4px 8px}
.steps{flex:1;display:flex;gap:6px}
.steps i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--zc)}
.hearts{font-size:20px;white-space:nowrap}
.hearts .lost{filter:grayscale(1);opacity:.3}
.lesson h4{margin:1.3em 0 .4em;font-size:17px}
.lesson p{margin:.6em 0}
.lesson ul,.lesson ol{padding-left:1.3em}
.lesson li{margin:.3em 0}
.lesson code,.lesson pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:color-mix(in srgb,var(--zc) 10%,var(--card));border-radius:6px}
.lesson code{padding:1px 6px}
.lesson pre{padding:12px 14px;overflow:auto;white-space:pre-wrap;border:1px solid var(--line)}
.tip,.ex{border-radius:12px;padding:12px 14px;margin:14px 0;font-size:15px}
.tip{background:color-mix(in srgb,var(--gold) 14%,var(--card));border-left:5px solid var(--gold)}
.tip::before{content:"💡 ";}
.ex{background:color-mix(in srgb,var(--zc) 9%,var(--card));border-left:5px solid var(--zc)}
.ex::before{content:"🎼 Beispiel: ";font-weight:800}
.keys{margin-top:18px;border:2px dashed color-mix(in srgb,var(--zc) 50%,var(--line));border-radius:14px;padding:12px 16px}
.keys b{display:block;margin-bottom:4px}
.keys li{margin:.25em 0}
.sticky-foot{position:sticky;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.card .sticky-foot{background:linear-gradient(color-mix(in srgb,var(--card) 0%,transparent),var(--card) 30%);margin:0 -2px}
/* Questions */
.qtype{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--zc)}
.qtext{font-size:20px;margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:600;transition:border-color .12s,background .12s}
.opt:hover{border-color:color-mix(in srgb,var(--zc) 55%,var(--line))}
.opt.sel{border-color:var(--zc);background:color-mix(in srgb,var(--zc) 10%,var(--card))}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{text-align:center;font-size:18px;padding:18px}
.pool,.answer{display:flex;flex-direction:column;gap:8px;min-height:52px}
.answer{border:2px dashed var(--line);border-radius:14px;padding:8px;margin-bottom:14px;counter-reset:ord}
.answer .chip{counter-increment:ord}
.answer .chip::before{content:counter(ord) ". ";font-weight:900;color:var(--zc)}
.answer:empty::before{content:"Tippe die Einträge unten in der richtigen Reihenfolge an";color:var(--muted);font-size:14px;padding:6px}
.chip{padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:600;text-align:left}
.chip.right{border-color:var(--good);background:var(--good-bg)}
.chip.wrong{border-color:var(--bad);background:var(--bad-bg)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-bottom:10px}
.mrow .ml{font-weight:700;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--zc) 9%,var(--card))}
select{font:inherit;width:100%;padding:11px 10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
select.right{border-color:var(--good);background:var(--good-bg)}
select.wrong{border-color:var(--bad);background:var(--bad-bg)}
@media (max-width:520px){.mrow{grid-template-columns:1fr;gap:6px;margin-bottom:16px}}
.feedback{margin-top:16px;border-radius:14px;padding:14px 16px}
.feedback.ok{background:var(--good-bg);border:2px solid var(--good)}
.feedback.no{background:var(--bad-bg);border:2px solid var(--bad)}
.feedback h4{margin:0 0 4px;font-size:18px}
.feedback .sol{font-weight:700;margin:6px 0}
.feedback p{margin:4px 0 12px}
/* Practice */
textarea{width:100%;min-height:130px;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.solution{white-space:pre-wrap;background:color-mix(in srgb,var(--good) 10%,var(--card));border-left:5px solid var(--good);border-radius:12px;padding:12px 14px;margin:12px 0}
.hint{background:color-mix(in srgb,var(--gold) 12%,var(--card));border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15px}
/* Result */
.result{text-align:center}
.result .big{font-size:64px;line-height:1.1}
.bigstars{font-size:40px;letter-spacing:6px;margin:8px 0}
.xplist{max-width:340px;margin:14px auto;text-align:left}
.xplist div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.xplist div:last-child{border:0;font-weight:900}
/* Stats & badges */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:26px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.badge .bi{font-size:38px}
.badge b{display:block;font-size:14px;margin-top:4px}
.badge small{color:var(--muted);font-size:12px;line-height:1.3;display:block;margin-top:2px}
.badge.locked .bi{filter:grayscale(1);opacity:.3}
.badge.locked b{color:var(--muted)}
.ranks{list-style:none;padding:0;margin:0}
.ranks li{display:flex;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.ranks li.cur{font-weight:900;color:var(--accent)}
.ranks li.future{color:var(--muted)}
.ranks .ri{font-size:24px;width:32px;text-align:center}
.ranks small{margin-left:auto;color:var(--muted)}
.section{margin-top:26px}
.toggle{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.toggle input{width:22px;height:22px;margin-top:2px}
/* Nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:transparent;padding:9px 4px 10px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button span{font-size:22px}
nav button.on{color:var(--accent)}
nav .cnt{position:absolute;top:4px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;line-height:18px}
/* Toast & modal */
#toasts{position:fixed;top:70px;left:0;right:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#111827;color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .35s ease-out, tout .4s ease-in 2.6s forwards}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}
@keyframes tout{to{transform:translateY(-14px);opacity:0}}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px}
#modal .card{max-width:420px;width:100%;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
#modal .big{font-size:72px;line-height:1.1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
/* Certificate */
.cert{position:relative;background:#fffdf7;color:#2b2414;border:10px double #b08d3c;border-radius:8px;padding:38px 28px;text-align:center;font-family:Georgia,"Times New Roman",serif}
.cert h1{font-size:36px;margin:.1em 0;color:#7a5c12;letter-spacing:.02em}
.cert .who{font-size:30px;font-style:italic;margin:14px 0;border-bottom:1px solid #b08d3c;display:inline-block;padding:0 24px 4px;min-width:60%}
.cert .seal{font-size:54px}
.cert ul{display:inline-block;text-align:left;margin:10px auto;font-size:15px}
.cert .foot{display:flex;justify-content:space-between;margin-top:26px;font-size:14px;gap:12px;flex-wrap:wrap}
.cert small{display:block;margin-top:18px;color:#7b6c4a;font-size:12px}
@media print{
  body *{visibility:hidden}
  #certprint, #certprint *{visibility:visible}
  #certprint{position:absolute;left:0;top:0;width:100%}
  nav,#top{display:none}
}
</style>
</head>
<body>
<header id="top"></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toasts"></div>
<canvas id="confetti"></canvas>
<script>
(window.ZONES = window.ZONES || []).push({
  id: "z0",
  title: "Start",
  subtitle: "Deine Lernreise beginnt",
  icon: "🚀",
  color: "#0ea5e9",
  badge: { name: "Losgelaufen", icon: "👟" },
  levels: [
    {
      id: "z0l1",
      title: "Willkommen an Bord",
      icon: "👋",
      lesson: `
<p>Schön, dass du da bist! Diese App führt dich in <b>8 Zonen</b> von null bis zu <b>Claude Code</b>. Sie folgt dem Aufbau der Kurse <i>KI-Manager</i> und <i>Claude Code Masterclass</i> von kilernen.de, erklärt aber alles in eigenen Worten und mit eigenen Übungen.</p>
<h4>So läuft jedes Level ab</h4>
<ol>
<li><b>Lernen:</b> Du liest eine kurze Lerneinheit. Fachbegriffe werden immer erklärt.</li>
<li><b>Quiz:</b> 3 bis 5 Fragen. Du hast <b>3 Herzen ❤️</b>. Jede falsche Antwort kostet ein Herz.</li>
<li><b>Praxis:</b> Eine kleine Aufgabe zum Selbermachen. Danach vergleichst du mit der Musterlösung.</li>
</ol>
<h4>Was du sammelst</h4>
<ul>
<li><b>XP</b> für jede richtige Antwort, jedes Level und jede Praxisaufgabe</li>
<li><b>Ränge</b> vom <i>KI-Neuling</i> bis zum <i>Agent-Meister</i></li>
<li><b>Streak 🔥</b>: Lerne an aufeinanderfolgenden Tagen</li>
<li><b>Badges</b> für jede abgeschlossene Zone und besondere Leistungen</li>
</ul>
<div class="tip">Falsch beantwortete Fragen landen automatisch im <b>Wiederholungs-Modus</b>. So festigst du genau das, was noch wackelt.</div>
<p>Am Ende wartet der <b>Endboss</b>: eine Abschlussprüfung über alle Zonen. Bestehst du sie, bekommst du deine Urkunde.</p>`,
      keys: [
        "Jedes Level: Lernen → Quiz → Praxis",
        "3 Herzen pro Quiz-Versuch",
        "Fehler landen im Wiederholungs-Modus",
        "Endboss-Prüfung am Schluss"
      ],
      quiz: [
        { t: "order", q: "Bringe die Schritte eines Levels in die richtige Reihenfolge.", o: ["Lerneinheit lesen", "Quiz beantworten", "Praxisaufgabe lösen"], e: "Erst verstehen, dann prüfen, dann anwenden." },
        { t: "mc", q: "Was passiert mit Fragen, die du falsch beantwortest?", o: ["Sie verschwinden", "Sie landen im Wiederholungs-Modus", "Du verlierst alle XP", "Das Level wird gesperrt"], a: 1, e: "Im Wiederholungs-Modus übst du gezielt deine Schwachstellen." },
        { t: "tf", q: "Wenn du an mehreren Tagen hintereinander lernst, wächst deine Streak.", a: true, e: "Die Streak 🔥 zählt aufeinanderfolgende Lerntage." }
      ],
      practice: {
        task: "Schreibe in 1–2 Sätzen auf, was du mit KI in deinem Alltag oder Beruf erreichen willst.",
        hint: "Denk an wiederkehrende Aufgaben, die dich Zeit kosten: E-Mails, Planung, Recherche, Organisation.",
        solution: "Beispiel: „Ich möchte KI nutzen, um Probenpläne, E-Mails an Veranstalter und Vereinsorganisation schneller zu erledigen, und mit Claude Code eigene kleine Tools bauen.“ Ein klares Ziel hilft dir, das Gelernte immer gleich auf deine Situation zu übertragen."
      }
    }
  ]
});

(window.ZONES = window.ZONES || []).push({
  id: "z1",
  title: "KI-Fundament",
  subtitle: "Was KI ist und wie man sie strategisch einsetzt",
  icon: "🧠",
  color: "#8b5cf6",
  badge: { name: "Fundament gelegt", icon: "🏛️" },
  levels: [
    {
      id: "z1l1",
      title: "Was ist KI? Eine kurze Geschichte",
      icon: "📜",
      lesson: `
<p><b>Künstliche Intelligenz (KI)</b> bezeichnet Computersysteme, die Aufgaben lösen, für die man bisher menschliche Intelligenz brauchte: Sprache verstehen, Bilder erkennen, Entscheidungen vorbereiten, Texte schreiben.</p>
<h4>Meilensteine</h4>
<ul>
<li><b>1950:</b> Alan Turing fragt, ob Maschinen denken können, und schlägt den „Turing-Test“ vor.</li>
<li><b>1956:</b> Auf der Dartmouth-Konferenz wird der Begriff „Artificial Intelligence“ geprägt.</li>
<li><b>1970er/80er:</b> „KI-Winter“: Die großen Versprechen werden nicht eingelöst, Geld und Interesse brechen ein.</li>
<li><b>1997:</b> Der Schachcomputer Deep Blue schlägt Weltmeister Kasparow.</li>
<li><b>2012:</b> Durchbruch des <b>Deep Learning</b> bei der Bilderkennung, möglich durch viel Daten und starke Grafikkarten.</li>
<li><b>2017:</b> Die <b>Transformer</b>-Architektur wird vorgestellt. Sie ist die Basis heutiger Sprachmodelle.</li>
<li><b>2022:</b> ChatGPT macht generative KI für alle zugänglich. Danach folgen Claude, Gemini und viele andere.</li>
</ul>
<h4>Die vierte industrielle Revolution</h4>
<p>Man spricht oft von vier industriellen Revolutionen: <b>Dampfmaschine</b> → <b>Elektrizität und Fließband</b> → <b>Computer und Automatisierung</b> → <b>Vernetzung und KI</b>. Neu ist diesmal: Automatisiert wird nicht nur Handarbeit, sondern auch <b>Wissensarbeit</b>.</p>
<div class="ex">Vergleich aus der Musik: Früher hat ein Notenstecher Partituren von Hand gesetzt, dann kam Notensatz-Software. KI geht einen Schritt weiter: Sie kann z. B. aus einer Beschreibung einen Probenplan entwerfen.</div>`,
      keys: [
        "KI = Systeme, die „intelligente“ Aufgaben lösen",
        "1956 Begriff geprägt, 2012 Deep Learning, 2017 Transformer, 2022 ChatGPT",
        "4. industrielle Revolution: Automatisierung von Wissensarbeit"
      ],

<p>Ein <b>KI-Manager</b> ist die Brücke zwischen Technik und Alltag eines Unternehmens oder Vereins. Er muss nicht programmieren können. Er muss aber verstehen, <b>was KI kann</b>, <b>wo sie hilft</b> und <b>wie man sie sicher einführt</b>.</p>
<h4>Typische Verantwortungsbereiche</h4>
<ol>
<li><b>Potenziale erkennen:</b> Wo kostet uns etwas viel Zeit? Wo passieren Fehler?</li>
<li><b>Strategie entwickeln:</b> Was machen wir zuerst, was später?</li>
<li><b>Tools auswählen:</b> Welche Software passt zu uns und unserem Budget?</li>
<li><b>Prozesse automatisieren:</b> Abläufe so bauen, dass sie ohne Handarbeit laufen.</li>
<li><b>Recht und Sicherheit:</b> Datenschutz, EU AI Act, Zugangsdaten.</li>
<li><b>Menschen befähigen:</b> Kolleginnen schulen, Ängste nehmen, Regeln aufstellen.</li>

<p>Am Anfang machen fast alle dieselben Fehler. Wer sie kennt, spart Zeit, Geld und Frust.</p>
<h4>Typische Denkfehler</h4>
<ul>
<li><b>„KI weiß alles.“</b> Nein. Sie kann überzeugend falsche Dinge sagen (Halluzinationen).</li>
<li><b>„Ein Prompt reicht.“</b> Gute Ergebnisse entstehen durch Iteration: nachschärfen, korrigieren, verbessern.</li>
<li><b>„Erst das Tool, dann der Zweck.“</b> Umgekehrt ist es richtig.</li>
<li><b>„Alles auf einmal automatisieren.“</b> Besser mit einem kleinen, klaren Pilotprojekt starten.</li>
<li><b>„KI ersetzt Menschen komplett.“</b> Meist übernimmt sie Teilaufgaben, und der Mensch kontrolliert.</li>
<li><b>„Daten sind egal.“</b> Ohne saubere Daten und klare Abläufe bringt die beste KI wenig.</li>

      lesson: `
<p>Klassische Software folgt festen Regeln, die ein Mensch programmiert hat: „Wenn A, dann B.“ <b>Machine Learning (ML)</b> dreht das um: Der Computer <b>lernt Regeln selbst aus Beispielen</b>.</p>
<div class="ex">Spam-Filter: Statt jede Spam-Regel von Hand zu schreiben, zeigt man dem System tausende Mails mit der Markierung „Spam“ oder „kein Spam“. Es lernt selbst, woran man Spam erkennt.</div>
<h4>Drei Lernarten</h4>
<ul>
<li><b>Überwachtes Lernen:</b> Beispiele mit richtiger Antwort (Mail + „Spam“).</li>
<li><b>Unüberwachtes Lernen:</b> Ohne Antworten. Das System findet selbst Gruppen und Muster, z. B. Kundentypen.</li>
<li><b>Bestärkendes Lernen:</b> Lernen durch Belohnung und Strafe, z. B. ein Schachprogramm, das gegen sich selbst spielt.</li>
</ul>
<h4>Deep Learning</h4>
<p><b>Deep Learning</b> ist eine Form von ML mit <b>künstlichen neuronalen Netzen</b>, die viele Schichten haben („deep“ = tief). Jede Schicht erkennt etwas Komplexeres: erst Kanten, dann Formen, dann ganze Gesichter.</p>
<p><b>Training</b> heißt: Das Netz macht eine Vorhersage, vergleicht sie mit der richtigen Antwort und passt seine inneren Gewichte ein kleines Stück an. Das wiederholt es millionenfach.</p>
<div class="tip">Die Zwiebel-Regel: <b>KI</b> ⊃ <b>Machine Learning</b> ⊃ <b>Deep Learning</b> ⊃ <b>generative KI / LLMs</b></div>
<p>Ein Risiko heißt <b>Overfitting</b>: Das Modell lernt die Trainingsbeispiele auswendig, statt das Prinzip zu verstehen. Bei neuen Daten versagt es dann.</p>`,

      lesson: `
<p><b>Generative KI</b> erzeugt <b>neue Inhalte</b>: Texte, Bilder, Musik, Code, Sprache. Die wichtigste Form für Textarbeit sind <b>Large Language Models (LLMs)</b>, große Sprachmodelle wie Claude, GPT oder Gemini.</p>
<h4>Wie ein LLM funktioniert, ganz einfach</h4>
<p>Ein LLM hat beim Training riesige Textmengen gesehen. Es hat gelernt, <b>vorherzusagen, welches Textstück als Nächstes am wahrscheinlichsten kommt</b>. Aus vielen solcher Vorhersagen hintereinander entstehen ganze Antworten.</p>
<ul>
<li><b>Token:</b> Die Einheit, in der ein LLM Text verarbeitet. Ein Token ist etwa ein Wortteil. Als Faustregel: 100 Tokens entsprechen ca. 60–75 Wörtern.</li>
<li><b>Kontextfenster:</b> Wie viel Text das Modell gleichzeitig „im Blick“ hat, also Gespräch plus Dokumente.</li>
<li><b>Prompt:</b> Deine Eingabe bzw. Anweisung an das Modell.</li>
</ul>
<h4>Prädiktive vs. generative KI</h4>
<p><b>Prädiktive KI</b> sagt etwas voraus oder ordnet ein, z. B. „Kündigt dieser Kunde wahrscheinlich?“. <b>Generative KI</b> erschafft etwas Neues, z. B. „Schreibe eine Mail an diesen Kunden“.</p>
<h4>Multimodal</h4>
<p><b>Multimodale</b> Modelle verstehen und erzeugen mehrere Formate: Text, Bilder, Audio, teils Video. Du kannst z. B. ein Foto eines Dienstplans hochladen und daraus eine Tabelle machen lassen.</p>
<div class="tip">Ein LLM „weiß“ nichts im menschlichen Sinn. Es erzeugt <b>wahrscheinliche</b> Texte. Darum klingt es immer überzeugend, auch wenn es falsch liegt.</div>`,

      lesson: `
<p>Eine <b>Halluzination</b> ist eine Antwort, die überzeugend klingt, aber <b>falsch oder erfunden</b> ist: ein erfundenes Zitat, eine falsche Jahreszahl, eine Quelle, die es nicht gibt.</p>
<h4>Warum passiert das?</h4>
<p>Ein LLM erzeugt <b>wahrscheinliche</b> Texte, nicht <b>geprüfte</b> Fakten. Fehlt ihm Wissen, füllt es die Lücke mit etwas, das plausibel klingt. Es hat kein eingebautes Gefühl für „Das weiß ich nicht“.</p>
<h4>Wann ist das Risiko hoch?</h4>
<ul>
<li>Sehr spezielle Fakten wie Namen, Zahlen, Paragraphen oder Quellen</li>
<li>Ereignisse nach dem Trainingsstand des Modells</li>
<li>Fragen, die eine falsche Annahme enthalten („Warum hat Mozart Jazz komponiert?“)</li>
</ul>
<h4>Gegenmittel</h4>
<ul>
<li><b>Quellen mitgeben:</b> Lade das Dokument hoch, statt aus dem Gedächtnis fragen zu lassen. Das ist die Idee hinter <b>RAG</b>, das du in Zone 2 kennenlernst.</li>
<li><b>Websuche aktivieren</b> für aktuelle Infos.</li>
<li><b>Erlaubnis zum Nichtwissen:</b> „Wenn du es nicht sicher weißt, sag es.“</li>
<li><b>Quellenangaben verlangen</b> und stichprobenartig prüfen.</li>
<li><b>Mensch im Prozess</b> (Human in the Loop) bei wichtigen Entscheidungen.</li>
</ul>
<div class="tip">Faustregel: Je teurer ein Fehler, desto mehr menschliche Kontrolle.</div>`,

      title: "Assistenten, Agenten und APIs",
      icon: "🤖",
      lesson: `
<h4>Assistent</h4>
<p>Ein <b>KI-Assistent</b> antwortet auf deine Fragen. Du fragst, er antwortet, und du entscheidest, was du damit machst. Beispiel: Chat mit Claude.</p>
<h4>Agent</h4>
<p>Ein <b>KI-Agent</b> bekommt ein <b>Ziel</b> und arbeitet selbstständig in mehreren Schritten darauf hin. Er kann <b>Werkzeuge (Tools)</b> benutzen: im Web suchen, Dateien lesen und schreiben, E-Mails verschicken, Programme ausführen. Er plant, handelt, prüft das Ergebnis und macht weiter.</p>
<div class="ex"><b>Assistent:</b> „Schreib mir eine Mail an den Veranstalter.“ → Du kopierst sie und schickst sie selbst.<br><b>Agent:</b> „Kläre mit allen Veranstaltern die Technikanforderungen.“ → Er liest die Verträge, schreibt die Mails, sammelt die Antworten und erstellt eine Übersicht.</div>
<p><b>Claude Code</b>, das Ziel deiner Reise, ist genau so ein Agent.</p>
<h4>API</h4>
<p>Eine <b>API</b> (Application Programming Interface) ist eine <b>Schnittstelle, über die Programme miteinander sprechen</b>. Stell dir einen Kellner vor: Du (Programm A) bestellst beim Kellner (API), er bringt die Bestellung in die Küche (Programm B) und das Essen zurück.</p>
<ul>
<li>Über die API eines KI-Anbieters kann deine eigene Software das Modell nutzen, ganz ohne Chatfenster.</li>
<li>Abgerechnet wird meist <b>pro Token</b>, also nach Verbrauch.</li>
</ul>
<div class="tip">Agenten sind mächtig, aber riskanter: Je mehr sie selbst dürfen, desto wichtiger sind klare Grenzen und Berechtigungen.</div>`,

      icon: "🗺️",
      lesson: `
<h4>Process Map</h4>
<p>Eine <b>Process Map</b> (Prozesslandkarte) zeigt alle wichtigen Abläufe einer Organisation auf einen Blick: Wer macht was, in welcher Reihenfolge, mit welchen Tools? Erst wenn du einen Prozess sichtbar machst, erkennst du, wo KI helfen kann.</p>
<div class="ex">Beispiel „Konzert organisieren“: Anfrage → Termin prüfen → Angebot → Vertrag → Besetzung → Probenplan → Noten → Reise → Abrechnung.</div>
<h4>Engpasskonzentriertes Arbeiten</h4>
<p>Eine Kette ist nur so stark wie ihr schwächstes Glied. Statt überall ein bisschen zu verbessern, suchst du den <b>Engpass</b>: den Schritt, der am meisten bremst. Dort setzt du zuerst an.</p>
<h4>KI-Strategie in 5 Phasen</h4>
<ol>
<li><b>Analyse:</b> Prozesse erfassen, Zeitfresser und Engpässe finden.</li>
<li><b>Priorisierung:</b> Nach Nutzen und Aufwand ordnen. Zuerst die „Quick Wins“ mit großem Nutzen und wenig Aufwand.</li>
<li><b>Pilot:</b> Einen Anwendungsfall klein testen und messen.</li>
<li><b>Umsetzung:</b> Das, was funktioniert, sauber einführen, dokumentieren und schulen.</li>
<li><b>Skalierung und Optimierung:</b> Auf weitere Bereiche übertragen, laufend messen und verbessern.</li>

<p>Ein LLM kennt deine internen Dokumente nicht. <b>RAG</b> (Retrieval Augmented Generation) löst das: Vor der Antwort werden <b>passende Textstellen aus deinen Dokumenten gesucht</b> und dem Modell mitgegeben.</p>
<h4>So funktioniert RAG</h4>
<ol>
<li><b>Aufbereiten:</b> Dokumente werden in kleine Abschnitte zerlegt (<b>Chunks</b>).</li>
<li><b>Embeddings:</b> Jeder Abschnitt wird in eine Zahlenreihe umgewandelt, die seine <b>Bedeutung</b> beschreibt.</li>
<li><b>Speichern:</b> Diese Zahlen kommen in eine <b>Vektordatenbank</b>, z. B. Supabase, Pinecone oder Qdrant.</li>
<li><b>Suchen (Retrieval):</b> Bei einer Frage werden die bedeutungsähnlichsten Abschnitte gefunden, auch wenn andere Wörter benutzt werden.</li>
<li><b>Antworten (Generation):</b> Das LLM bekommt Frage und Abschnitte und formuliert die Antwort.</li>
</ol>
<div class="ex">Frage: „Wie viel Urlaub habe ich?“ → RAG findet den Abschnitt „Jahresurlaub: 30 Tage“ im Tarifvertrag, obwohl dort nicht „Urlaub haben“ steht.</div>
<h4>RAG, Fine-Tuning oder beides?</h4>
<ul>
<li><b>RAG:</b> Für <b>Wissen</b>, das sich ändert. Leicht aktuell zu halten und Quellen sind nachvollziehbar.</li>
<li><b>Fine-Tuning:</b> Das Modell wird mit eigenen Beispielen nachtrainiert. Gut für <b>Stil und Format</b>, aufwendig und schlecht für wechselndes Wissen.</li>
<li><b>RAFT:</b> Eine Kombination: Das Modell wird darauf trainiert, gut mit gefundenen Dokumenten umzugehen.</li>

<p>Ein <b>Voice Agent</b> ist ein KI-Agent, der <b>per Sprache</b> kommuniziert, meist am Telefon. Er nimmt Anrufe an, beantwortet Fragen, bucht Termine oder ruft selbst an.</p>

<ol>
<li><b>STT</b> (Speech-to-Text): Die Stimme des Anrufers wird in Text umgewandelt.</li>
<li><b>LLM:</b> Das Sprachmodell versteht den Text, entscheidet und formuliert eine Antwort. Bei Bedarf ruft es Tools auf, z. B. den Kalender.</li>
<li><b>TTS</b> (Text-to-Speech): Die Antwort wird in natürliche Sprache umgewandelt, z. B. mit ElevenLabs.</li>
</ol>

<h4>Die große Herausforderung: Latenz</h4>
<p><b>Latenz</b> ist die Verzögerung zwischen Frage und Antwort. Im Telefonat wirken schon über 1 Sekunde Pause unnatürlich. Deshalb sind schnelle Modelle und gute Plattformen entscheidend.</p>

<ul>

<h4>Plan Mode, der Modus, den viele nicht kennen</h4>
<p>Im <b>Plan Mode</b> darf Claude Code nur <b>lesen und nachdenken</b>, aber nichts ändern. Er untersucht dein Projekt und legt dir einen <b>Plan</b> vor. Erst wenn du zustimmst, setzt er ihn um.</p>

<li><code>/context</code>: Zeigt, wie voll das Kontextfenster ist.</li>
</ul>
<h4>Modelle und Tokens</h4>
<ul>
<li><code>/model</code>: Modell wechseln, z. B. Opus für schwierige Aufgaben und ein schnelleres Modell für einfache.</li>
<li>Bei Abos gibt es <b>Nutzungslimits</b>. Lange Gespräche, große Dateien und große Modelle verbrauchen mehr.</li>

name: pressetext

      lesson: `
<p>Ein <b>Subagent</b> ist ein <b>spezialisierter Helfer</b>, an den Claude Code eine Teilaufgabe abgibt. Er arbeitet in seinem <b>eigenen Kontextfenster</b> und liefert nur das Ergebnis zurück.</p>
<h4>Warum das hilft</h4>
<ul>
<li><b>Sauberer Hauptkontext:</b> Die Recherche in 50 Dateien landet nicht in deinem Hauptgespräch, nur das Ergebnis.</li>
<li><b>Spezialisierung:</b> Ein Agent nur für Tests, einer nur für Texte, einer nur fürs Prüfen.</li>
<li><b>Parallelität:</b> Mehrere Subagents können gleichzeitig arbeiten.</li>
<li><b>Unabhängige Prüfung:</b> Ein Prüf-Agent, der das Ergebnis nicht selbst gebaut hat, findet mehr Fehler.</li>
</ul>
<h4>Eigene Subagents</h4>
<p>Mit <code>/agents</code> erstellst und verwaltest du sie. Sie liegen als Markdown-Dateien in <code>.claude/agents/</code>, mit Name, Beschreibung, erlaubten Tools und einer eigenen Systemanweisung.</p>

<p>Ein <b>Hook</b> ist ein Befehl, der <b>automatisch</b> an einem bestimmten Punkt der Arbeit von Claude Code ausgeführt wird, <b>immer</b> und ohne dass Claude es „vergessen“ kann.</p>
<h4>Warum Hooks?</h4>
<p>Anweisungen in der CLAUDE.md sind <b>Bitten</b>: Claude befolgt sie meistens. Hooks sind <b>Regeln</b>: Sie laufen garantiert. Das nennt man <b>deterministisch</b>.</p>
<h4>Wichtige Zeitpunkte (Events)</h4>
<ul>
<li><b>PreToolUse:</b> <b>Bevor</b> Claude ein Werkzeug benutzt. Kann Aktionen <b>blockieren</b>, z. B. „Niemals Dateien im Ordner /archiv löschen“.</li>
<li><b>PostToolUse:</b> <b>Nachdem</b> Claude ein Werkzeug benutzt hat, z. B. nach jeder Dateiänderung automatisch formatieren oder Tests starten.</li>
<li><b>UserPromptSubmit:</b> Wenn du eine Nachricht abschickst.</li>
<li><b>Stop:</b> Wenn Claude fertig ist, z. B. eine Benachrichtigung schicken.</li>
<li><b>SessionStart:</b> Beim Start einer Sitzung, z. B. aktuelle Infos laden.</li>
</ul>
<h4>Einrichten</h4>
<p>Hooks werden in der <code>settings.json</code> definiert. Mit <code>/hooks</code> kannst du sie ansehen und verwalten.</p>

    { id: "review10", n: "Fehlerjäger", i: "🎯", d: "10 Fehler im Wiederholungs-Modus ausgebügelt", t: () => S.reviewFixed >= 10 },

      .concat(SPECIAL_BADGES);

  // ---------- Zustand ----------
  const KEY = "ki-lernreise-v1";
  function defaults() {
    return { xp: 0, done: {}, wrong: {}, practice: {}, notes: {}, streak: { count: 0, best: 0, last: null },
      badges: {}, boss: { passed: false, best: 0, date: null }, name: "", free: false, reviewFixed: 0, started: Date.now() };
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      const s = raw ? JSON.parse(raw) : null;
      const d = defaults();
      if (!s) return d;
      Object.keys(d).forEach(k => { if (s[k] === undefined) s[k] = d[k]; });
      return s;
    } catch (e) { return defaults(); }

  let S = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* Speicher nicht verfügbar */ } }

  // ---------- Helfer ----------
  const $ = sel => document.querySelector(sel);
  function h(tag, attrs) {
    const el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(k => {
      const v = attrs[k];
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "style") el.setAttribute("style", v);
      else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
    });
    for (let i = 2; i < arguments.length; i++) {
      const c = arguments[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) c.forEach(x => x != null && el.append(x));
      else el.append(c);
    }
    return el;
  }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function dateKey(d) { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

  function touchStreak() {

  function confetti() {

      ctx.clearRect(0, 0, c.width, c.height);

      const path = h("div", { class: "path" });
      zl.forEach((l, i) => {
        const un = isUnlocked(l), dn = S.done[l.id], isNext = nl && nl.id === l.id;
        const node = h("div", { class: "node" + (un ? "" : " locked") + (dn ? " done" : "") + (isNext ? " next" : ""), style: "transform:translateX(" + OFFSETS[i % OFFSETS.length] + "px)" },
          isNext ? h("div", { class: "start-tag" }, done ? "Weiter" : "Start") : null,
          h("button", { class: "nbtn", "aria-label": l.title, onclick: () => un ? (RUN = null, go("level", l.id)) : toast("🔒 Schließe zuerst das vorherige Level ab") }, un ? l.icon : "🔒"),
          h("div", { class: "nlabel" }, l.title),

      });

    });
    const bu = bossUnlocked();
    app.append(h("section", { class: "zone" + (bu ? "" : " locked"), style: "--zc:#111827" },

        h("div", null, h("h2", null, "Endboss: Abschlussprüfung"), h("p", null, BOSS_COUNT + " Fragen aus allen Zonen · " + BOSS_PASS + " richtige zum Bestehen")),
        h("div", { class: "zprog" }, S.boss.passed ? "✅" : (bu ? "" : "🔒"))),

  }

  // ---------- Fragen-Komponente ----------
  const TYPE_LABEL = { mc: "Multiple Choice", tf: "Wahr oder falsch?", order: "Reihenfolge", match: "Zuordnen" };
  function renderQuestion(q, el, opts, done) {
    opts = opts || {};
    el.innerHTML = "";
    const body = h("div");
    const fb = h("div", { class: "feedback hidden" });
    const checkRow = h("div", { class: "sticky-foot" });
    let locked = false;
    el.append(h("div", { class: "qtype" }, (opts.label ? opts.label + " · " : "") + TYPE_LABEL[q.t]), h("h3", { class: "qtext" }, q.q), body, fb, checkRow);

    function finish(ok, solutionText) {
      if (locked) return; locked = true;
      checkRow.innerHTML = "";
      fb.className = "feedback " + (ok ? "ok" : "no");
      fb.innerHTML = "";
      fb.append(
        h("h4", null, ok ? "✅ Richtig!" : "❌ Leider falsch" + (opts.wrongNote ? " " + opts.wrongNote : "")),
        !ok && solutionText ? h("div", { class: "sol" }, "Richtig wäre: ", solutionText) : null,
        h("p", null, q.e),
        h("button", { class: "btn wide " + (ok ? "good" : "bad"), onclick: () => done(ok) }, opts.nextLabel || "Weiter"));
      fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    if (q.t === "mc" || q.t === "tf") {
      const choices = q.t === "tf" ? [[true, "👍 Wahr"], [false, "👎 Falsch"]] : shuffle(q.o.map((t, i) => [i, t]));
      const box = h("div", { class: "opts" + (q.t === "tf" ? " tf" : "") });
      const btns = [];
      choices.forEach(c => {
        const b = h("button", { class: "opt", onclick: () => {
          if (locked) return;
          const ok = c[0] === q.a;
          b.classList.add(ok ? "right" : "wrong");
          if (!ok) btns.forEach(x => { if (x.v === q.a) x.b.classList.add("right"); });
          finish(ok, ok ? null : (q.t === "tf" ? (q.a ? "Wahr" : "Falsch") : q.o[q.a]));
        } }, c[1]);
        btns.push({ v: c[0], b: b });
        box.append(b);
      });
      body.append(box);
    } else if (q.t === "order") {
      let items = shuffle(q.o);
      let guard = 0;
      while (items.join("|") === q.o.join("|") && guard++ < 10) items = shuffle(q.o);
      const answer = h("div", { class: "answer" }), pool = h("div", { class: "pool" });
      const chosen = [];
      const checkBtn = h("button", { class: "btn wide zone", disabled: true, onclick: () => {
        const ok = chosen.join("|") === q.o.join("|");
        Array.from(answer.children).forEach((c, i) => c.classList.add(chosen[i] === q.o[i] ? "right" : "wrong"));
        finish(ok, ok ? null : q.o.map((t, i) => (i + 1) + ". " + t).join("  →  "));
      } }, "Prüfen");
      function draw() {
        answer.innerHTML = ""; pool.innerHTML = "";
        chosen.forEach((t, i) => answer.append(h("button", { class: "chip", onclick: () => { if (locked) return; chosen.splice(i, 1); draw(); } }, t)));
        items.filter(t => !chosen.includes(t)).forEach(t => pool.append(h("button", { class: "chip", onclick: () => { if (locked) return; chosen.push(t); draw(); } }, t)));
        checkBtn.disabled = chosen.length !== q.o.length;
      }
      draw();
      body.append(answer, pool);
      checkRow.append(checkBtn);
    } else if (q.t === "match") {
      const rights = shuffle(q.p.map(p => p[1]));
      const sels = [];
      const checkBtn = h("button", { class: "btn wide zone", disabled: true, onclick: () => {
        let ok = true;
        sels.forEach((s, i) => { const r = s.value === q.p[i][1]; s.classList.add(r ? "right" : "wrong"); s.disabled = true; if (!r) ok = false; });
        finish(ok, ok ? null : q.p.map(p => p[0] + " → " + p[1]).join(" · "));
      } }, "Prüfen");
      q.p.forEach(p => {
        const s = h("select", { onchange: () => { checkBtn.disabled = sels.some(x => !x.value); } },
          h("option", { value: "" }, "– wählen –"), rights.map(r => h("option", { value: r }, r)));
        sels.push(s);
        body.append(h("div", { class: "mrow" }, h("div", { class: "ml" }, p[0]), s));
      });
      checkRow.append(checkBtn);
    }
  }

  // ---------- Level ----------
  let RUN = null;

    const l = LEVEL_BY_ID[id];
    if (!l) return go("map");
    document.documentElement.style.setProperty("--zc", l.zone.color);

    const head = h("div", { class: "lvlhead" },
      h("button", { class: "xbtn", title: "Zur Karte", onclick: () => { RUN = null; go("map", true); } }, "✕"),
      h("div", { class: "steps" }, ["lesson", "quiz", "practice", "result"].map((s, i) => h("i", { class: i <= ["lesson", "quiz", "practice", "result"].indexOf(RUN.step === "fail" ? "quiz" : RUN.step) ? "on" : "" }))),
      RUN.step === "quiz" ? h("div", { class: "hearts" }, [0, 1, 2].map(i => h("span", { class: i < RUN.hearts ? "" : "lost" }, "❤️"))) : null);
    app.append(head);

  function setStep(step) { RUN.step = step; go("level", RUN.level.id); }

  function stepLesson(card, l) {
    card.append(
      h("div", { class: "qtype" }, l.zone.icon + " " + l.zone.title + " · Level " + (l.li + 1) + "/" + l.zone.levels.length),
      h("h1", null, l.icon + " " + l.title),
      h("div", { class: "lesson", html: l.lesson }),
      h("div", { class: "keys" }, h("b", null, "📌 Das Wichtigste"), h("ul", null, l.keys.map(k => h("li", null, k)))),
      h("div", { class: "sticky-foot" }, h("button", { class: "btn wide zone", onclick: () => { RUN.qi = 0; RUN.hearts = 3; RUN.correct = 0; setStep("quiz"); } }, "Verstanden, zum Quiz →")));
  }

  function stepQuiz(card, l) {
    const qid = l.id + "#" + RUN.qi;
    const q = l.quiz[RUN.qi];
    renderQuestion(q, card, { label: "Frage " + (RUN.qi + 1) + "/" + l.quiz.length, wrongNote: "· −1 ❤️" }, ok => {
      if (ok) { RUN.correct++; delete S.wrong[qid]; }
      else { RUN.hearts--; S.wrong[qid] = dateKey(); }
      save();
      if (RUN.hearts <= 0) return setStep("fail");
      RUN.qi++;
      if (RUN.qi >= l.quiz.length) { completeLevel(); return setStep("practice"); }
      setStep("quiz");
    });
  }

  function completeLevel() {
    const l = RUN.level, prev = S.done[l.id], stars = RUN.hearts, perfect = RUN.hearts === 3;
    const parts = [];
    if (!prev) {
      parts.push(["Richtige Antworten (" + RUN.correct + " × " + XP.correct + ")", RUN.correct * XP.correct]);
      parts.push(["Level abgeschlossen", XP.level]);
      if (perfect) parts.push(["Perfekt, ohne Fehler!", XP.perfect]);
      S.done[l.id] = { stars: stars, perfect: perfect, date: dateKey() };
    } else {
      parts.push(["Wiederholung (" + RUN.correct + " × " + XP.replay + ")", RUN.correct * XP.replay]);
      if (perfect && !prev.perfect) parts.push(["Jetzt perfekt!", XP.perfect]);
      prev.stars = Math.max(prev.stars, stars); prev.perfect = prev.perfect || perfect;
    }
    RUN.parts = parts; RUN.firstTime = !prev;
    const sum = parts.reduce((a, p) => a + p[1], 0);
    addXP(sum);
    checkBadges();
  }

  function stepPractice(card, l) {
    const p = l.practice;
    const ta = h("textarea", { placeholder: "Deine Lösung … (wird nur in diesem Browser gespeichert)", oninput: e => { S.notes[l.id] = e.target.value; save(); } });
    ta.value = S.notes[l.id] || "";
    const hint = h("div", { class: "hint hidden" }, "💡 Tipp: " + p.hint);
    const sol = h("div", { class: "solution hidden" }, h("b", null, "Musterlösung"), h("br"), p.solution);
    const already = !!S.practice[l.id];
    const doneBtn = h("button", { class: "btn wide good hidden", onclick: () => {
      if (!S.practice[l.id]) { S.practice[l.id] = dateKey(); RUN.practiceXP = XP.practice; addXP(XP.practice); checkBadges(); }
      setStep("result");
    } }, already ? "Weiter →" : "✓ Erledigt (+" + XP.practice + " XP)");
    const showBtn = h("button", { class: "btn wide zone", onclick: () => { sol.classList.remove("hidden"); doneBtn.classList.remove("hidden"); showBtn.classList.add("hidden"); sol.scrollIntoView({ block: "nearest", behavior: "smooth" }); } }, "Musterlösung zeigen");
    card.append(
      h("div", { class: "qtype" }, "🛠️ Praxisaufgabe"),

        h("button", { class: "btn ghost wide", style: "margin-top:10px", onclick: () => setStep("result") }, "Überspringen")));
  }

  function stepResult(card, l) {
    const parts = (RUN.parts || []).slice();
    if (RUN.practiceXP) parts.push(["Praxisaufgabe", RUN.practiceXP]);
    const sum = parts.reduce((a, p) => a + p[1], 0);
    const stars = RUN.hearts;

      h("div", { class: "big" }, zoneDone ? l.zone.badge.icon : "🎉"),

      h("div", { class: "bigstars" }, "⭐".repeat(stars) + "☆".repeat(3 - stars)),
      h("div", { class: "muted" }, RUN.correct + " von " + l.quiz.length + " richtig"),
      h("div", { class: "xplist" }, parts.map(p => h("div", null, h("span", null, p[0]), h("span", null, "+" + p[1]))), h("div", null, h("span", null, "Gesamt"), h("span", null, "+" + sum + " XP"))),
      h("div", { class: "sticky-foot" },

        h("button", { class: "btn ghost wide", style: "margin-top:10px", onclick: () => { RUN = null; go("map", true); } }, "Zur Karte")));

  // ---------- Wiederholen ----------

  // ---------- Endboss ----------
  let BOSS = null;
  function pickBoss() {
    const byZone = {};
    Object.values(QUESTIONS).forEach(x => { if (x.level.zone.id === "z0") return; (byZone[x.level.zone.id] = byZone[x.level.zone.id] || []).push(x.qid); });
    let pick = [];
    Object.keys(byZone).forEach(z => { pick = pick.concat(shuffle(byZone[z]).slice(0, 2)); });
    const rest = shuffle(Object.values(byZone).flat().filter(q => !pick.includes(q)));
    pick = pick.concat(rest.slice(0, BOSS_COUNT - pick.length));
    return shuffle(pick);
  }
  function viewBoss(app) {
    document.documentElement.style.setProperty("--zc", "#111827");
    if (!BOSS) {
      const bu = bossUnlocked();
      app.append(h("div", { class: "card result" }, h("div", { class: "big" }, bu ? "🐉" : "🔒"), h("h1", null, "Endboss: Abschlussprüfung"),
        h("p", null, BOSS_COUNT + " zufällige Fragen aus allen Zonen. Keine Herzen, aber du brauchst ", h("b", null, BOSS_PASS + " richtige Antworten (80 %)"), " zum Bestehen."),
        S.boss.best ? h("p", { class: "muted" }, "Dein Bestwert: " + S.boss.best + "/" + BOSS_COUNT + (S.boss.passed ? " · bestanden ✅" : "")) : null,
        bu ? h("button", { class: "btn wide", onclick: () => { BOSS = { list: pickBoss(), i: 0, ok: 0, wrong: [] }; go("boss"); } }, S.boss.passed ? "Nochmal antreten" : "⚔️ Kampf beginnen")
           : h("p", { class: "muted" }, "Schließe zuerst alle " + LEVELS.length + " Levels ab (" + doneCount() + " geschafft). Oder aktiviere unter „Erfolge“ den freien Modus."),

      const b = BOSS; BOSS = null;

        h("div", { class: "row", style: "justify-content:center" },

          h("button", { class: "btn ghost", onclick: () => go("map", true) }, "Zur Karte"))));
      return;
    }
    const item = QUESTIONS[BOSS.list[BOSS.i]];
    const card = h("div", { class: "card" });
    app.append(h("div", { class: "lvlhead" }, h("button", { class: "xbtn", onclick: () => { if (confirm("Prüfung abbrechen? Der Fortschritt dieses Versuchs geht verloren.")) { BOSS = null; go("boss"); } } }, "✕"),
      h("div", { class: "steps" }, BOSS.list.map((_, i) => h("i", { class: i < BOSS.i ? "on" : "" }))),

  // ---------- Erfolge / Profil ----------
  function viewProfile(app) {
    const ri = rankIndex(S.xp);

    const file = h("input", { type: "file", accept: "application/json", class: "hidden", onchange: e => {
      const f = e.target.files[0]; if (!f) return;
      f.text().then(t => { try { const d = JSON.parse(t); if (typeof d.xp !== "number" || !d.done) throw 0; S = Object.assign(defaults(), d); save(); toast("✅ Fortschritt importiert"); go("profile"); } catch (err) { toast("⚠️ Datei konnte nicht gelesen werden"); } });
    } });
    app.append(h("div", { class: "section card" }, h("h2", null, "⚙️ Einstellungen"),
      h("label", { class: "toggle" }, free, h("span", null, h("b", null, "Freier Modus"), h("br"), h("span", { class: "muted" }, "Alle Levels und den Endboss sofort freischalten, z. B. um gezielt ein Thema nachzuschlagen."))),
      h("p", { class: "muted" }, "Dein Fortschritt wird nur in diesem Browser gespeichert. Mit Export und Import nimmst du ihn auf ein anderes Gerät mit."),
      h("div", { class: "row" },
        h("button", { class: "btn ghost", onclick: exportState }, "⬇️ Exportieren"),
        h("button", { class: "btn ghost", onclick: () => file.click() }, "⬆️ Importieren"), file,
        S.boss.passed ? h("button", { class: "btn ghost", onclick: () => go("cert") }, "📜 Urkunde") : null,
        h("button", { class: "btn ghost", style: "color:var(--bad)", onclick: () => { if (confirm("Wirklich den gesamten Fortschritt löschen?")) { S = defaults(); save(); RUN = REV = BOSS = null; go("map"); } } }, "🗑️ Zurücksetzen"))),
      h("p", { class: "muted", style: "font-size:13px;margin-top:22px" }, "Diese App orientiert sich am Aufbau der Kurse „KI-Manager“ und „Claude Code Masterclass“ von kilernen.de (Everlast KI Academy). Alle Texte und Aufgaben sind eigenständig formuliert. Sie bereitet dich auf die Kurse vor, ersetzt aber weder die Kurse noch deren offizielle Zertifizierung. Keine Rechtsberatung."));
  }
  function stat(v, l) { return h("div", { class: "stat" }, h("b", null, String(v)), h("span", { class: "muted" }, l)); }
  function exportState() {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const a = h("a", { href: URL.createObjectURL(blob), download: "ki-lernreise-fortschritt-" + dateKey() + ".json" });
    document.body.append(a); a.click(); a.remove();
  }

  // ---------- Urkunde ----------
  function viewCert(app) {
    if (!S.boss.passed) { app.append(h("div", { class: "card result" }, h("div", { class: "big" }, "🔒"), h("h1", null, "Noch keine Urkunde"), h("p", { class: "muted" }, "Besiege zuerst den Endboss."), h("button", { class: "btn", onclick: () => go("boss") }, "🐉 Zum Endboss"))); return; }
    const who = h("div", { class: "who" }, S.name || "Dein Name");
    const inp = h("input", { type: "text", placeholder: "Dein Name für die Urkunde", style: "font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);flex:1;min-width:200px",
      oninput: e => { S.name = e.target.value; save(); who.textContent = S.name || "Dein Name"; } });
    inp.value = S.name;
    const d = S.boss.date ? S.boss.date.split("-").reverse().join(".") : dateKey().split("-").reverse().join(".");
    app.append(h("div", { class: "row", style: "margin-bottom:16px" }, inp, h("button", { class: "btn", onclick: () => print() }, "🖨️ Drucken / PDF")),
      h("div", { id: "certprint" }, h("div", { class: "cert" },
        h("div", { class: "seal" }, "🏆"),
        h("div", { style: "letter-spacing:.2em;text-transform:uppercase;font-size:13px" }, "Urkunde"),
        h("h1", null, "KI-Lernreise"),
        h("div", null, "Hiermit wird bestätigt, dass"),
        who,
        h("div", null, "alle " + LEVELS.length + " Levels und die Abschlussprüfung (" + S.boss.best + "/" + BOSS_COUNT + ") erfolgreich gemeistert hat:"),
        h("ul", null, ZONES.filter(z => z.id !== "z0").map(z => h("li", null, z.icon + " " + z.title))),
        h("div", null, "Erreichter Rang: ", h("b", null, RANKS[rankIndex(S.xp)].i + " " + RANKS[rankIndex(S.xp)].n), " · " + fmt(S.xp) + " XP"),
        h("div", { class: "foot" }, h("span", null, "Datum: " + d), h("span", null, "Badges: " + Object.keys(S.badges).length)),
        h("small", null, "Selbstlern-Urkunde zur Vorbereitung auf die Kurse „KI-Manager“ und „Claude Code Masterclass“. Kein offizielles Zertifikat."))));
  }

  // ---------- Start ----------
  go("map", true);
})();

</script>
</body>
</html>
