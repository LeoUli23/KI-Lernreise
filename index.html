<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KI-Lernreise: vom KI-Manager zu Claude Code</title>
<meta name="description" content="Interaktive Lern-App mit Gamification: KI-Grundlagen, Prompt Engineering, Automation, Voice Agents und Claude Code.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1f2328; --muted:#6b7280; --line:#e7e3da;
  --accent:#6d28d9; --accent-2:#8b5cf6; --good:#16a34a; --good-bg:#e8f7ee; --bad:#dc2626; --bad-bg:#fdecec;
  --gold:#f59e0b; --shadow:0 2px 0 rgba(0,0,0,.06), 0 8px 24px rgba(31,35,40,.06);
  --r:16px; --zc:#6d28d9;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14151a; --card:#1d1f26; --ink:#eceef2; --muted:#9aa1ad; --line:#2c2f39;
    --good-bg:#12301f; --bad-bg:#3a1717; --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
/* Top bar */
#top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:17px;white-space:nowrap}
.rankbox{flex:1;min-width:0}
.rankname{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.rankname span:last-child{color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pill{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:15px;white-space:nowrap}
.pill.streak.off{filter:grayscale(1);opacity:.55}
/* Layout */
main{max-width:760px;margin:0 auto;padding:18px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
h1,h2,h3{letter-spacing:-.02em;line-height:1.25}
h1{font-size:28px;margin:.2em 0 .4em}
h2{font-size:22px;margin:.2em 0 .5em}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font-weight:800;background:var(--accent);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 65%,#000);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.btn.zone{background:var(--zc);box-shadow:0 4px 0 color-mix(in srgb,var(--zc) 65%,#000)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.good{background:var(--good);box-shadow:0 4px 0 #0f6b30}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 #8f1717}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Hero */
.hero{display:flex;gap:16px;align-items:center;margin-bottom:22px}
.hero .big{font-size:46px;line-height:1}
.hero h1{margin:0;font-size:24px}
.overall{margin-top:8px}
/* Map */
.zone{margin:30px 0 12px}
.zhead{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:var(--r);color:#fff;background:var(--zc);box-shadow:0 4px 0 color-mix(in srgb,var(--zc) 60%,#000)}
.zhead .zi{font-size:34px}
.zhead h2{margin:0;font-size:19px;color:#fff}
.zhead p{margin:2px 0 0;font-size:13.5px;opacity:.92}
.zhead .zprog{margin-left:auto;text-align:right;font-weight:800;font-size:14px;white-space:nowrap}
.zone.locked .zhead{background:#9ca3af;box-shadow:0 4px 0 #6b7280}
.path{display:flex;flex-direction:column;align-items:center;padding:18px 0 6px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;margin:8px 0;width:160px}
.nbtn{width:74px;height:70px;border-radius:50%;border:0;font-size:30px;display:grid;place-items:center;background:var(--zc);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--zc) 60%,#000);transition:transform .1s}
.nbtn:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--zc) 60%,#000)}
.node.locked .nbtn{background:var(--line);color:var(--muted);box-shadow:0 6px 0 color-mix(in srgb,var(--line) 70%,#000);cursor:not-allowed;font-size:24px}
.node.next .nbtn{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 6px 0 color-mix(in srgb,var(--zc) 60%,#000),0 0 0 0 color-mix(in srgb,var(--zc) 55%,transparent)}70%{box-shadow:0 6px 0 color-mix(in srgb,var(--zc) 60%,#000),0 0 0 16px transparent}100%{box-shadow:0 6px 0 color-mix(in srgb,var(--zc) 60%,#000),0 0 0 0 transparent}}
.node.done .nbtn::after{content:"✓";position:absolute;top:-4px;right:38px;background:var(--gold);color:#fff;width:24px;height:24px;border-radius:50%;font-size:14px;font-weight:900;display:grid;place-items:center;border:2px solid var(--bg)}
.nlabel{font-size:13px;font-weight:700;text-align:center;margin-top:9px;line-height:1.25}
.node.locked .nlabel{color:var(--muted)}
.stars{font-size:13px;letter-spacing:1px;height:16px}
.start-tag{position:absolute;top:-30px;background:var(--card);border:2px solid var(--zc);color:var(--zc);font-weight:900;font-size:12px;padding:3px 10px;border-radius:10px;text-transform:uppercase;letter-spacing:.05em;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.bossnode .nbtn{width:92px;height:88px;font-size:44px;background:#111827;box-shadow:0 6px 0 #000}
/* Level */
.lvlhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.xbtn{border:0;background:transparent;font-size:24px;color:var(--muted);padding:4px 8px}
.steps{flex:1;display:flex;gap:6px}
.steps i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--zc)}
.hearts{font-size:20px;white-space:nowrap}
.hearts .lost{filter:grayscale(1);opacity:.3}
.lesson h4{margin:1.3em 0 .4em;font-size:17px}
.lesson p{margin:.6em 0}
.lesson ul,.lesson ol{padding-left:1.3em}
.lesson li{margin:.3em 0}
.lesson code,.lesson pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:color-mix(in srgb,var(--zc) 10%,var(--card));border-radius:6px}
.lesson code{padding:1px 6px}
.lesson pre{padding:12px 14px;overflow:auto;white-space:pre-wrap;border:1px solid var(--line)}
.tip,.ex{border-radius:12px;padding:12px 14px;margin:14px 0;font-size:15px}
.tip{background:color-mix(in srgb,var(--gold) 14%,var(--card));border-left:5px solid var(--gold)}
.tip::before{content:"💡 ";}
.ex{background:color-mix(in srgb,var(--zc) 9%,var(--card));border-left:5px solid var(--zc)}
.ex::before{content:"🎼 Beispiel: ";font-weight:800}
.keys{margin-top:18px;border:2px dashed color-mix(in srgb,var(--zc) 50%,var(--line));border-radius:14px;padding:12px 16px}
.keys b{display:block;margin-bottom:4px}
.keys li{margin:.25em 0}
.sticky-foot{position:sticky;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.card .sticky-foot{background:linear-gradient(color-mix(in srgb,var(--card) 0%,transparent),var(--card) 30%);margin:0 -2px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.flow span{background:var(--card);border:2px solid color-mix(in srgb,var(--zc) 40%,var(--line));border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px;line-height:1.3}
.flow span small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.flow i{font-style:normal;color:var(--zc);font-weight:900}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.matrix div{border-radius:12px;padding:12px;font-size:14px;line-height:1.35}
.matrix b{display:block;font-size:15px;margin-bottom:2px}
.matrix .q1{background:var(--good-bg);border:2px solid var(--good)}
.matrix .q2{background:color-mix(in srgb,var(--gold) 14%,var(--card));border:2px solid var(--gold)}
.matrix .q3{background:color-mix(in srgb,var(--zc) 9%,var(--card));border:2px solid var(--line)}
.matrix .q4{background:var(--bad-bg);border:2px solid var(--bad)}
.lesson table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px;display:block;overflow-x:auto}
.lesson th,.lesson td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.lesson th{background:color-mix(in srgb,var(--zc) 12%,var(--card));font-weight:800}
.lesson td code{white-space:nowrap}
/* Questions */
.qtype{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--zc)}
.qtext{font-size:20px;margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:600;transition:border-color .12s,background .12s}
.opt:hover{border-color:color-mix(in srgb,var(--zc) 55%,var(--line))}
.opt.sel{border-color:var(--zc);background:color-mix(in srgb,var(--zc) 10%,var(--card))}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{text-align:center;font-size:18px;padding:18px}
.pool,.answer{display:flex;flex-direction:column;gap:8px;min-height:52px}
.answer{border:2px dashed var(--line);border-radius:14px;padding:8px;margin-bottom:14px;counter-reset:ord}
.answer .chip{counter-increment:ord}
.answer .chip::before{content:counter(ord) ". ";font-weight:900;color:var(--zc)}
.answer:empty::before{content:"Tippe die Einträge unten in der richtigen Reihenfolge an";color:var(--muted);font-size:14px;padding:6px}
.chip{padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:600;text-align:left}
.chip.right{border-color:var(--good);background:var(--good-bg)}
.chip.wrong{border-color:var(--bad);background:var(--bad-bg)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-bottom:10px}
.mrow .ml{font-weight:700;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--zc) 9%,var(--card))}
select{font:inherit;width:100%;padding:11px 10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
select.right{border-color:var(--good);background:var(--good-bg)}
select.wrong{border-color:var(--bad);background:var(--bad-bg)}
@media (max-width:520px){.mrow{grid-template-columns:1fr;gap:6px;margin-bottom:16px}}
.feedback{margin-top:16px;border-radius:14px;padding:14px 16px}
.feedback.ok{background:var(--good-bg);border:2px solid var(--good)}
.feedback.no{background:var(--bad-bg);border:2px solid var(--bad)}
.feedback h4{margin:0 0 4px;font-size:18px}
.feedback .sol{font-weight:700;margin:6px 0}
.feedback p{margin:4px 0 12px}
/* Practice */
textarea{width:100%;min-height:130px;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.solution{white-space:pre-wrap;background:color-mix(in srgb,var(--good) 10%,var(--card));border-left:5px solid var(--good);border-radius:12px;padding:12px 14px;margin:12px 0}
.hint{background:color-mix(in srgb,var(--gold) 12%,var(--card));border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15px}
/* Result */
.result{text-align:center}
.result .big{font-size:64px;line-height:1.1}
.bigstars{font-size:40px;letter-spacing:6px;margin:8px 0}
.xplist{max-width:340px;margin:14px auto;text-align:left}
.xplist div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.xplist div:last-child{border:0;font-weight:900}
/* Stats & badges */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:26px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.badge .bi{font-size:38px}
.badge b{display:block;font-size:14px;margin-top:4px}
.badge small{color:var(--muted);font-size:12px;line-height:1.3;display:block;margin-top:2px}
.badge.locked .bi{filter:grayscale(1);opacity:.3}
.badge.locked b{color:var(--muted)}
.ranks{list-style:none;padding:0;margin:0}
.ranks li{display:flex;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.ranks li.cur{font-weight:900;color:var(--accent)}
.ranks li.future{color:var(--muted)}
.ranks .ri{font-size:24px;width:32px;text-align:center}
.ranks small{margin-left:auto;color:var(--muted)}
.section{margin-top:26px}
.toggle{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.toggle input{width:22px;height:22px;margin-top:2px}
/* Nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:transparent;padding:9px 4px 10px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button span{font-size:22px}
nav button.on{color:var(--accent)}
nav .cnt{position:absolute;top:4px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;line-height:18px}
/* Toast & modal */
#toasts{position:fixed;top:70px;left:0;right:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#111827;color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .35s ease-out, tout .4s ease-in 2.6s forwards}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}
@keyframes tout{to{transform:translateY(-14px);opacity:0}}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px}
#modal .card{max-width:420px;width:100%;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
#modal .big{font-size:72px;line-height:1.1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
/* Certificate */
.cert{position:relative;background:#fffdf7;color:#2b2414;border:10px double #b08d3c;border-radius:8px;padding:38px 28px;text-align:center;font-family:Georgia,"Times New Roman",serif}
.cert h1{font-size:36px;margin:.1em 0;color:#7a5c12;letter-spacing:.02em}
.cert .who{font-size:30px;font-style:italic;margin:14px 0;border-bottom:1px solid #b08d3c;display:inline-block;padding:0 24px 4px;min-width:60%}
.cert .seal{font-size:54px}
.cert ul{display:inline-block;text-align:left;margin:10px auto;font-size:15px}
.cert .foot{display:flex;justify-content:space-between;margin-top:26px;font-size:14px;gap:12px;flex-wrap:wrap}
.cert small{display:block;margin-top:18px;color:#7b6c4a;font-size:12px}
@media print{
  body *{visibility:hidden}
  #certprint, #certprint *{visibility:visible}
  #certprint{position:absolute;left:0;top:0;width:100%}
  nav,#top{display:none}
}
</style>
</head>
<body>
<header id="top"></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toasts"></div>
<canvas id="confetti"></canvas>
<script>
(window.ZONES = window.ZONES || []).push({
  id: "z0",
  title: "Start",
  subtitle: "Deine Lernreise beginnt",
  icon: "🚀",
  color: "#0ea5e9",
  badge: { name: "Losgelaufen", icon: "👟" },
  levels: [
    {
      id: "z0l1",
      title: "Willkommen an Bord",
      icon: "👋",
      lesson: `
<p>Schön, dass du da bist! Diese App führt dich in <b>8 Zonen</b> von null bis zu <b>Claude Code</b>. Sie folgt dem Aufbau der Kurse <i>KI-Manager</i> und <i>Claude Code Masterclass</i> von kilernen.de, erklärt aber alles in eigenen Worten und mit eigenen Übungen.</p>
<h4>So läuft jedes Level ab</h4>
<ol>
<li><b>Lernen:</b> Du liest eine kurze Lerneinheit. Fachbegriffe werden immer erklärt.</li>
<li><b>Quiz:</b> 3 bis 5 Fragen. Du hast <b>3 Herzen ❤️</b>. Jede falsche Antwort kostet ein Herz.</li>
<li><b>Praxis:</b> Eine kleine Aufgabe zum Selbermachen. Danach vergleichst du mit der Musterlösung.</li>
</ol>
<h4>Was du sammelst</h4>
<ul>
<li><b>XP</b> für jede richtige Antwort, jedes Level und jede Praxisaufgabe</li>
<li><b>Ränge</b> vom <i>KI-Neuling</i> bis zum <i>Agent-Meister</i></li>
<li><b>Streak 🔥</b>: Lerne an aufeinanderfolgenden Tagen</li>
<li><b>Badges</b> für jede abgeschlossene Zone und besondere Leistungen</li>
</ul>
<div class="tip">Falsch beantwortete Fragen landen automatisch im <b>Wiederholungs-Modus</b>. So festigst du genau das, was noch wackelt.</div>
<p>Am Ende wartet der <b>Endboss</b>: eine Abschlussprüfung über alle Zonen. Bestehst du sie, bekommst du deine Urkunde.</p>`,
      keys: [
        "Jedes Level: Lernen → Quiz → Praxis",
        "3 Herzen pro Quiz-Versuch",
        "Fehler landen im Wiederholungs-Modus",
        "Endboss-Prüfung am Schluss"
      ],
      quiz: [
        { t: "order", q: "Bringe die Schritte eines Levels in die richtige Reihenfolge.", o: ["Lerneinheit lesen", "Quiz beantworten", "Praxisaufgabe lösen"], e: "Erst verstehen, dann prüfen, dann anwenden." },
        { t: "mc", q: "Was passiert mit Fragen, die du falsch beantwortest?", o: ["Sie verschwinden", "Sie landen im Wiederholungs-Modus", "Du verlierst alle XP", "Das Level wird gesperrt"], a: 1, e: "Im Wiederholungs-Modus übst du gezielt deine Schwachstellen." },
        { t: "tf", q: "Wenn du an mehreren Tagen hintereinander lernst, wächst deine Streak.", a: true, e: "Die Streak 🔥 zählt aufeinanderfolgende Lerntage." }
      ],
      practice: {
        task: "Schreibe in 1–2 Sätzen auf, was du mit KI in deinem Alltag oder Beruf erreichen willst.",
        hint: "Denk an wiederkehrende Aufgaben, die dich Zeit kosten: E-Mails, Planung, Recherche, Organisation.",
        solution: "Beispiel: „Ich möchte KI nutzen, um Probenpläne, E-Mails an Veranstalter und Vereinsorganisation schneller zu erledigen, und mit Claude Code eigene kleine Tools bauen.“ Ein klares Ziel hilft dir, das Gelernte immer gleich auf deine Situation zu übertragen."
      }
    }
  ]
});

(window.ZONES = window.ZONES || []).push({
  id: "z1",
  title: "KI-Fundament",
  subtitle: "Was KI ist und wie man sie strategisch einsetzt",
  icon: "🧠",
  color: "#8b5cf6",
  badge: { name: "Fundament gelegt", icon: "🏛️" },
  levels: [
    {
      id: "z1l1",
      title: "Was ist KI? Eine kurze Geschichte",
      icon: "📜",
      lesson: `
<p><b>Künstliche Intelligenz (KI)</b> bezeichnet Computersysteme, die Aufgaben lösen, für die man bisher menschliche Intelligenz brauchte: Sprache verstehen, Bilder erkennen, Entscheidungen vorbereiten, Texte schreiben.</p>
<h4>Meilensteine</h4>
<ul>
<li><b>1950:</b> Alan Turing fragt, ob Maschinen denken können, und schlägt den „Turing-Test“ vor.</li>
<li><b>1956:</b> Auf der Dartmouth-Konferenz wird der Begriff „Artificial Intelligence“ geprägt.</li>
<li><b>1970er/80er:</b> „KI-Winter“: Die großen Versprechen werden nicht eingelöst, Geld und Interesse brechen ein.</li>
<li><b>1997:</b> Der Schachcomputer Deep Blue schlägt Weltmeister Kasparow.</li>

      lesson: `
<p>Klassische Software folgt festen Regeln, die ein Mensch programmiert hat: „Wenn A, dann B.“ <b>Machine Learning (ML)</b> dreht das um: Der Computer <b>lernt Regeln selbst aus Beispielen</b>.</p>
<div class="ex">Spam-Filter: Statt jede Spam-Regel von Hand zu schreiben, zeigt man dem System tausende Mails mit der Markierung „Spam“ oder „kein Spam“. Es lernt selbst, woran man Spam erkennt.</div>
<h4>Drei Lernarten</h4>
<ul>
<li><b>Überwachtes Lernen:</b> Beispiele mit richtiger Antwort (Mail + „Spam“).</li>
<li><b>Unüberwachtes Lernen:</b> Ohne Antworten. Das System findet selbst Gruppen und Muster, z. B. Kundentypen.</li>
<li><b>Bestärkendes Lernen:</b> Lernen durch Belohnung und Strafe, z. B. ein Schachprogramm, das gegen sich selbst spielt.</li>
</ul>
<h4>Deep Learning</h4>
<p><b>Deep Learning</b> ist eine Form von ML mit <b>künstlichen neuronalen Netzen</b>, die viele Schichten haben („deep“ = tief). Jede Schicht erkennt etwas Komplexeres: erst Kanten, dann Formen, dann ganze Gesichter.</p>
<p><b>Training</b> heißt: Das Netz macht eine Vorhersage, vergleicht sie mit der richtigen Antwort und passt seine inneren Gewichte ein kleines Stück an. Das wiederholt es millionenfach.</p>
<div class="tip">Die Zwiebel-Regel: <b>KI</b> ⊃ <b>Machine Learning</b> ⊃ <b>Deep Learning</b> ⊃ <b>generative KI / LLMs</b></div>
<p>Ein Risiko heißt <b>Overfitting</b>: Das Modell lernt die Trainingsbeispiele auswendig, statt das Prinzip zu verstehen. Bei neuen Daten versagt es dann.</p>`,

      lesson: `
<p><b>Generative KI</b> erzeugt <b>neue Inhalte</b>: Texte, Bilder, Musik, Code, Sprache. Die wichtigste Form für Textarbeit sind <b>Large Language Models (LLMs)</b>, große Sprachmodelle wie Claude, GPT oder Gemini.</p>
<h4>Wie ein LLM funktioniert, ganz einfach</h4>
<p>Ein LLM hat beim Training riesige Textmengen gesehen. Es hat gelernt, <b>vorherzusagen, welches Textstück als Nächstes am wahrscheinlichsten kommt</b>. Aus vielen solcher Vorhersagen hintereinander entstehen ganze Antworten.</p>
<ul>
<li><b>Token:</b> Die Einheit, in der ein LLM Text verarbeitet. Ein Token ist etwa ein Wortteil. Als Faustregel: 100 Tokens entsprechen ca. 60–75 Wörtern.</li>
<li><b>Kontextfenster:</b> Wie viel Text das Modell gleichzeitig „im Blick“ hat, also Gespräch plus Dokumente.</li>
<li><b>Prompt:</b> Deine Eingabe bzw. Anweisung an das Modell.</li>
</ul>
<h4>Prädiktive vs. generative KI</h4>
<p><b>Prädiktive KI</b> sagt etwas voraus oder ordnet ein, z. B. „Kündigt dieser Kunde wahrscheinlich?“. <b>Generative KI</b> erschafft etwas Neues, z. B. „Schreibe eine Mail an diesen Kunden“.</p>
<h4>Multimodal</h4>
<p><b>Multimodale</b> Modelle verstehen und erzeugen mehrere Formate: Text, Bilder, Audio, teils Video. Du kannst z. B. ein Foto eines Dienstplans hochladen und daraus eine Tabelle machen lassen.</p>
<div class="tip">Ein LLM „weiß“ nichts im menschlichen Sinn. Es erzeugt <b>wahrscheinliche</b> Texte. Darum klingt es immer überzeugend, auch wenn es falsch liegt.</div>`,

      lesson: `
<p>Eine <b>Halluzination</b> ist eine Antwort, die überzeugend klingt, aber <b>falsch oder erfunden</b> ist: ein erfundenes Zitat, eine falsche Jahreszahl, eine Quelle, die es nicht gibt.</p>
<h4>Warum passiert das?</h4>
<p>Ein LLM erzeugt <b>wahrscheinliche</b> Texte, nicht <b>geprüfte</b> Fakten. Fehlt ihm Wissen, füllt es die Lücke mit etwas, das plausibel klingt. Es hat kein eingebautes Gefühl für „Das weiß ich nicht“.</p>
<h4>Wann ist das Risiko hoch?</h4>
<ul>
<li>Sehr spezielle Fakten wie Namen, Zahlen, Paragraphen oder Quellen</li>
<li>Ereignisse nach dem Trainingsstand des Modells</li>
<li>Fragen, die eine falsche Annahme enthalten („Warum hat Mozart Jazz komponiert?“)</li>
</ul>
<h4>Gegenmittel</h4>
<ul>
<li><b>Quellen mitgeben:</b> Lade das Dokument hoch, statt aus dem Gedächtnis fragen zu lassen. Das ist die Idee hinter <b>RAG</b>, das du in Zone 2 kennenlernst.</li>
<li><b>Websuche aktivieren</b> für aktuelle Infos.</li>
<li><b>Erlaubnis zum Nichtwissen:</b> „Wenn du es nicht sicher weißt, sag es.“</li>
<li><b>Quellenangaben verlangen</b> und stichprobenartig prüfen.</li>
<li><b>Mensch im Prozess</b> (Human in the Loop) bei wichtigen Entscheidungen.</li>
</ul>
<div class="tip">Faustregel: Je teurer ein Fehler, desto mehr menschliche Kontrolle.</div>`,

      lesson: `
<h4>Assistent</h4>
<p>Ein <b>KI-Assistent</b> antwortet auf deine Fragen. Du fragst, er antwortet, und du entscheidest, was du damit machst. Beispiel: Chat mit Claude.</p>
<h4>Agent</h4>
<p>Ein <b>KI-Agent</b> bekommt ein <b>Ziel</b> und arbeitet selbstständig in mehreren Schritten darauf hin. Er kann <b>Werkzeuge (Tools)</b> benutzen: im Web suchen, Dateien lesen und schreiben, E-Mails verschicken, Programme ausführen. Er plant, handelt, prüft das Ergebnis und macht weiter.</p>
<div class="ex"><b>Assistent:</b> „Schreib mir eine Mail an den Veranstalter.“ → Du kopierst sie und schickst sie selbst.<br><b>Agent:</b> „Kläre mit allen Veranstaltern die Technikanforderungen.“ → Er liest die Verträge, schreibt die Mails, sammelt die Antworten und erstellt eine Übersicht.</div>
<p><b>Claude Code</b>, das Ziel deiner Reise, ist genau so ein Agent.</p>
<h4>API</h4>
<p>Eine <b>API</b> (Application Programming Interface) ist eine <b>Schnittstelle, über die Programme miteinander sprechen</b>. Stell dir einen Kellner vor: Du (Programm A) bestellst beim Kellner (API), er bringt die Bestellung in die Küche (Programm B) und das Essen zurück.</p>
<ul>
<li>Über die API eines KI-Anbieters kann deine eigene Software das Modell nutzen, ganz ohne Chatfenster.</li>
<li>Abgerechnet wird meist <b>pro Token</b>, also nach Verbrauch.</li>
</ul>
<div class="tip">Agenten sind mächtig, aber riskanter: Je mehr sie selbst dürfen, desto wichtiger sind klare Grenzen und Berechtigungen.</div>`,

<p>Viele Organisationen starten mit KI so: Jemand hat ein Video gesehen, kauft ein Tool, probiert ein bisschen herum, und nach drei Wochen nutzt es keiner mehr. Eine <b>KI-Strategie</b> verhindert genau das. Sie beantwortet drei Fragen:</p>
<ol>
<li><b>Wo</b> lohnt sich KI bei uns wirklich?</li>
<li><b>In welcher Reihenfolge</b> gehen wir vor?</li>
<li><b>Woran</b> merken wir, dass es funktioniert?</li>
</ol>
<p>Das Werkzeug für Frage 1 ist die <b>Process Map</b>, für Frage 2 die <b>Engpass-Suche</b> und die <b>Priorisierung</b>, und der rote Faden für alles zusammen sind die <b>5 Phasen</b>.</p>

<h4>Teil 1: Die Process Map, also Abläufe sichtbar machen</h4>
<p>Ein <b>Prozess</b> ist ein Ablauf, der sich wiederholt und immer ungefähr gleich läuft: eine Anfrage beantworten, eine Rechnung schreiben, ein Konzert organisieren. Die meisten Prozesse existieren nur <b>im Kopf</b> der Leute, die sie machen. Und was man nicht sieht, kann man nicht verbessern.</p>
<p>Eine <b>Process Map</b> (Prozesslandkarte) zeichnet einen Ablauf Schritt für Schritt auf. Man kann sie sich wie eine <b>Partitur für Arbeitsabläufe</b> vorstellen: Wer spielt wann was, und wo gibt es Pausen?</p>
<p><b>Zu jedem Schritt notierst du fünf Dinge:</b></p>
<ul>
<li><b>Was</b> passiert? (kurz, mit Verb: „Angebot schreiben“)</li>
<li><b>Wer</b> macht es?</li>
<li><b>Womit</b>? (Mail, Excel, Papier, Telefon …)</li>
<li><b>Wie lange</b> dauert es, und wie oft kommt es vor?</li>
<li><b>Was nervt</b>? Wo gibt es Wartezeiten, Fehler, Rückfragen, doppelte Arbeit?</li>
</ul>
<div class="ex"><b>Process Map „Konzertanfrage bis Auftritt“</b> (für ein Ensemble, ca. 4 Anfragen im Monat):
<div class="flow"><span>📩 Anfrage kommt<small>Mail · 5 Min</small></span><i>→</i><span>📅 Termin prüfen<small>Kalender + 5 Musiker fragen · 2–3 Tage Wartezeit</small></span><i>→</i><span>💶 Angebot<small>Word-Vorlage · 45 Min</small></span><i>→</i><span>✍️ Vertrag<small>PDF hin und her · 30 Min</small></span><i>→</i><span>👥 Besetzung<small>WhatsApp · 1 Std</small></span><i>→</i><span>🎼 Noten + Probenplan<small>1,5 Std</small></span><i>→</i><span>🚐 Reise<small>1 Std</small></span><i>→</i><span>🧾 Abrechnung<small>Excel · 1 Std</small></span></div>
Notizen am Rand: „Verfügbarkeit abfragen dauert ewig“, „Angebot wird jedes Mal neu geschrieben“, „Abrechnung oft vergessen“.</div>
<p><b>So erstellst du eine Process Map in vier Schritten:</b></p>
<ol>
<li><b>Prozess wählen:</b> Einen konkreten Ablauf mit klarem Start und Ende („von Anfrage bis Auftritt“), nicht „unsere Organisation“.</li>
<li><b>Mit den Beteiligten sprechen:</b> Die Person, die es täglich macht, kennt die echten Schritte. Oft sieht der Prozess in der Praxis ganz anders aus als gedacht.</li>
<li><b>Aufzeichnen:</b> Haftnotizen an der Wand, ein Whiteboard oder einfach eine Liste mit Pfeilen. Schönheit ist egal.</li>
<li><b>Messen und markieren:</b> Zeit und Häufigkeit eintragen, Schmerzpunkte rot markieren.</li>
</ol>
<div class="tip">Rechne pro Schritt: <b>Dauer × Häufigkeit = Zeit pro Monat</b>. 45 Minuten Angebot × 4 Anfragen = 3 Stunden im Monat. So siehst du schwarz auf weiß, wo die Zeit hingeht.</div>

<h4>Teil 2: Den Engpass finden</h4>
<p>Stell dir eine Röhre vor, durch die Wasser fließt. Wie viel Wasser durchkommt, bestimmt die <b>engste Stelle</b>, nicht die breiteste. Bei Prozessen ist es genauso: Der langsamste Schritt bestimmt das Tempo des ganzen Ablaufs. Diese Stelle heißt <b>Engpass</b>.</p>
<p><b>Engpasskonzentriertes Arbeiten</b> heißt: Du verbesserst zuerst genau diese Stelle. Ein schnellerer Schritt <i>vor</i> dem Engpass bringt nichts, weil sich die Arbeit dann nur vor dem Engpass staut.</p>
<div class="ex">Im Konzert-Beispiel ist der Engpass „Termin prüfen“: 2–3 Tage Warten auf Antworten der Musiker. Wenn du das Angebot dank KI in 5 statt 45 Minuten schreibst, wartet der Veranstalter trotzdem 3 Tage. Erst wenn die Verfügbarkeit schneller geklärt ist, z. B. durch einen gemeinsamen Verfügbarkeitskalender, den jeder selbst pflegt, wird der <b>ganze</b> Ablauf schneller.</div>
<p><b>Woran du einen Engpass erkennst:</b></p>
<ul>
<li>Davor stapelt sich Arbeit („Ich warte noch auf …“).</li>
<li>Eine bestimmte Person ist ständig überlastet, und ohne sie geht nichts.</li>
<li>Hier passieren die meisten Fehler oder Rückfragen.</li>
<li>Kunden oder Kollegen beschweren sich genau über diesen Punkt.</li>
</ul>
<div class="tip">Ist der Engpass gelöst, wandert er weiter zum nächsten Schritt. Das ist normal. Darum ist eine KI-Strategie kein einmaliges Projekt, sondern ein Kreislauf.</div>

<h4>Teil 3: Priorisieren mit der Nutzen-Aufwand-Matrix</h4>
<p>Nach der Process Map hast du meist eine lange Liste an Ideen. Damit du nicht alles gleichzeitig anfängst, sortierst du jede Idee nach zwei Fragen: <b>Wie groß ist der Nutzen?</b> und <b>Wie groß ist der Aufwand?</b></p>
<div class="matrix">
<div class="q1"><b>⭐ Quick Wins</b>großer Nutzen, wenig Aufwand<br><i>→ sofort machen</i></div>
<div class="q2"><b>🏔️ Große Projekte</b>großer Nutzen, viel Aufwand<br><i>→ gut planen, später</i></div>
<div class="q3"><b>🧹 Kleinkram</b>kleiner Nutzen, wenig Aufwand<br><i>→ nebenbei, wenn Zeit ist</i></div>
<div class="q4"><b>🚫 Zeitfresser</b>kleiner Nutzen, viel Aufwand<br><i>→ lassen</i></div>
</div>
<div class="ex">Angebote mit einer KI-Vorlage erstellen → <b>Quick Win</b>. Ein eigener Voice Agent für Buchungen → <b>großes Projekt</b>. Eine KI, die Konzertfotos automatisch umbenennt → <b>Kleinkram</b>. Eine eigene KI-Plattform programmieren lassen → <b>Zeitfresser</b>.</div>

<h4>Teil 4: Die 5 Phasen der KI-Strategie</h4>
<p>Die 5 Phasen bringen alles in eine sinnvolle Reihenfolge. Zu jeder Phase: Ziel, Leitfragen, Ergebnis und typische Stolperfallen.</p>

<p><b>Phase 1: Analyse</b><br>
<i>Ziel:</i> Verstehen, wie wir heute arbeiten.<br>
<i>Leitfragen:</i> Welche Prozesse haben wir? Wo geht Zeit verloren? Wo ist der Engpass? Welche Daten und Tools gibt es schon?<br>
<i>Ergebnis:</i> Process Maps der wichtigsten Abläufe und eine Liste mit Ideen.<br>
<i>Stolperfalle:</i> Zu lange analysieren. Zwei oder drei Kernprozesse reichen für den Anfang.</p>

<p><b>Phase 2: Priorisierung</b><br>
<i>Ziel:</i> Entscheiden, womit wir anfangen.<br>
<i>Leitfragen:</i> Welche Idee hat den größten Nutzen bei vertretbarem Aufwand? Was löst den Engpass? Gibt es rechtliche Hürden (Datenschutz)?<br>
<i>Ergebnis:</i> Nutzen-Aufwand-Matrix und <b>ein</b> ausgewählter Anwendungsfall für den Pilot.<br>
<i>Stolperfalle:</i> Mit dem spannendsten statt mit dem sinnvollsten Projekt anfangen.</p>

<p><b>Phase 3: Pilot</b><br>
<i>Ziel:</i> Im Kleinen beweisen, dass es funktioniert.<br>
<i>Leitfragen:</i> Was genau soll die Lösung leisten (Lastenheft)? Woran messen wir Erfolg? Wer testet mit?<br>
<i>Ergebnis:</i> Eine funktionierende Testlösung mit wenigen Nutzern, einem festen Zeitraum (z. B. 4 Wochen) und Messwerten vorher und nachher.<br>
<i>Stolperfalle:</i> Keine Messgröße festlegen. Dann weiß am Ende niemand, ob es besser geworden ist.</p>

<p><b>Phase 4: Umsetzung</b><br>
<i>Ziel:</i> Das Bewährte zum festen Bestandteil machen.<br>
<i>Leitfragen:</i> Wer ist verantwortlich? Wie schulen wir alle? Wie dokumentieren wir den neuen Ablauf? Was passiert, wenn die KI einen Fehler macht?<br>
<i>Ergebnis:</i> Eingeführte Lösung, kurze Anleitung, geschulte Nutzer, klare Zuständigkeit.<br>
<i>Stolperfalle:</i> Die Menschen vergessen. Eine Lösung, die keiner versteht oder der keiner vertraut, wird nicht genutzt.</p>

<p><b>Phase 5: Skalierung und Optimierung</b><br>
<i>Ziel:</i> Mehr Nutzen aus dem Gelernten ziehen.<br>
<i>Leitfragen:</i> Lässt sich die Lösung auf andere Bereiche übertragen? Wo ist der neue Engpass? Was sagen die Messwerte nach drei Monaten?<br>
<i>Ergebnis:</i> Weitere Anwendungsfälle und regelmäßige Überprüfung, z. B. einmal im Quartal.<br>
<i>Stolperfalle:</i> Aufhören, nachzumessen. Tools ändern sich schnell, und was heute gut ist, kann in einem Jahr überholt sein.</p>

<div class="tip">Phase 5 führt zurück zu Phase 1: Mit dem neuen Engpass beginnt die nächste Runde. Die 5 Phasen sind also ein <b>Kreislauf</b>, keine Einbahnstraße.</div>

<h4>Teil 5: Lastenheft und Pflichtenheft</h4>
<p>Spätestens im Pilot brauchst du ein <b>Lastenheft</b>. Es beschreibt aus Sicht des Auftraggebers, <b>was</b> die Lösung leisten soll: Zweck, Nutzer, Eingaben, Ergebnisse, Grenzen und Erfolgskriterien. Das <b>Pflichtenheft</b> schreibt danach der Umsetzer. Es beschreibt, <b>wie</b> er das umsetzt: welche Tools, welche Schritte, welche Technik.</p>
<div class="ex">Lastenheft (Auszug): „Bei jeder Konzertanfrage soll innerhalb von 24 Stunden ein Angebot als PDF vorliegen. Grundlage sind unsere Preisliste und der Verfügbarkeitskalender. Vor dem Versand gibt der Leiter frei. Erfolg: Antwortzeit unter 24 Stunden in 90 % der Fälle.“<br>Pflichtenheft (Auszug): „Formular in Jotform → n8n liest Daten → Abgleich mit Google Kalender → Claude erstellt Angebotstext → PDF aus Vorlage → Freigabe-Mail an den Leiter.“</div>

<h4>Alles zusammen: das Beispiel im Durchlauf</h4>
<ol>
<li><b>Analyse:</b> Process Map „Anfrage bis Auftritt“ zeichnen. Engpass: Verfügbarkeit klären (3 Tage). Zeitfresser: Angebote (3 Std./Monat) und Abrechnung.</li>
<li><b>Priorisierung:</b> Quick Win: Angebote mit KI-Vorlage. Engpass-Lösung: gemeinsamer Verfügbarkeitskalender. Großes Projekt für später: automatisierter Ablauf von der Anfrage bis zum Angebot.</li>
<li><b>Pilot:</b> 4 Wochen lang Verfügbarkeitskalender plus KI-Angebotsvorlage. Messung vorher: 3 Tage bis zum Angebot. Nachher: 1 Tag.</li>
<li><b>Umsetzung:</b> Alle Musiker tragen sich ein, eine Anleitung auf einer Seite, der Leiter ist zuständig.</li>
<li><b>Skalierung:</b> Der neue Engpass ist die Abrechnung. Gleiches Vorgehen: Vorlage + KI, die Belege ausliest. Später: der automatisierte Gesamtablauf.</li>
</ol>`,

<p>Stell dir vor, jedes Mal, wenn jemand dein Kontaktformular ausfüllt, müsstest du: die Daten in eine Tabelle kopieren, eine Bestätigungsmail schreiben, das Team informieren und einen Termin eintragen. Viermal Handarbeit, jedes Mal gleich. Genau solche Abläufe übernimmt <b>Make</b>.</p>
<p><b>Make</b> (früher „Integromat“) ist ein <b>No-Code-Automationstool</b>. „No-Code“ heißt: Du programmierst nicht, sondern ziehst Bausteine auf eine Fläche und verbindest sie mit Linien. Make läuft komplett im Browser, in der Cloud. Du musst nichts installieren.</p>

<h4>Teil 1: Die Grundbegriffe</h4>
<ul>
<li><b>Szenario:</b> Eine komplette Automation, also ein Ablauf von Anfang bis Ende. In Make sieht ein Szenario aus wie eine Kette von Kreisen, die mit Linien verbunden sind.</li>
<li><b>Modul:</b> Ein einzelner Kreis, also ein Arbeitsschritt, z. B. „Zeile in Google Sheets hinzufügen“ oder „Mail in Gmail senden“. Jedes Modul gehört zu einer <b>App</b> (Gmail, Slack, Google Sheets …). Make hat Tausende davon.</li>
<li><b>Trigger:</b> Das erste Modul, das den Ablauf startet. Ohne Trigger passiert nichts.</li>
<li><b>Aktion:</b> Ein Modul, das etwas tut (anlegen, senden, ändern).</li>
<li><b>Suche:</b> Ein Modul, das etwas nachschlägt (z. B. „Finde den Kontakt mit dieser Mailadresse“).</li>
<li><b>Verbindung (Connection):</b> Die einmalige Anmeldung bei einer App, damit Make in deinem Namen arbeiten darf.</li>
</ul>

<h4>Teil 2: Zwei Arten von Triggern</h4>
<ul>
<li><b>Sofort-Trigger (Instant / Webhook):</b> Die App meldet sich bei Make, sobald etwas passiert. Make reagiert innerhalb von Sekunden. Erkennbar an einem kleinen Blitz-Symbol.</li>
<li><b>Geplanter Trigger (Polling):</b> Make fragt in festen Abständen nach, z. B. alle 15 Minuten: „Gibt es etwas Neues?“ Jede Nachfrage verbraucht Kontingent, auch wenn nichts Neues da ist.</li>
</ul>
<div class="tip">Wenn es einen Sofort-Trigger gibt, nimm ihn. Er ist schneller und spart Kontingent.</div>

<h4>Teil 3: Mapping, das Herzstück</h4>
<p>Jedes Modul liefert ein <b>Paket an Daten</b> (ein „Bundle“). Ein Formular liefert z. B. Name, Mail, Datum und Nachricht. Im nächsten Modul klickst du in ein Feld und wählst aus diesen Daten aus. Das nennt man <b>Mapping</b>: Du sagst Make, welcher Wert wohin gehört.</p>
<div class="ex">Im Modul „Mail senden“ schreibst du in den Betreff: „Danke für deine Anfrage, “ und klickst dann auf das grüne Feld <b>Name</b> aus dem Formular-Modul. Bei jedem Durchlauf steht dort automatisch der richtige Name.</div>
<p>Zusätzlich gibt es <b>Funktionen</b>, mit denen du Daten umformst: Datum formatieren, Text kürzen, Großbuchstaben, rechnen. Beispiel: Aus „2026-12-12“ wird „12.12.2026“.</p>

<h4>Teil 4: Verzweigen und Sortieren</h4>
<ul>
<li><b>Filter:</b> Eine Bedingung auf einer Verbindungslinie. Nur wenn sie erfüllt ist, geht es weiter. Beispiel: „Nur wenn Budget größer als 500 €.“</li>
<li><b>Router:</b> Teilt den Ablauf in mehrere Wege. Jeder Weg hat seinen eigenen Filter. Beispiel: Weg 1 für Konzertanfragen, Weg 2 für Unterrichtsanfragen, Weg 3 für alles andere.</li>
<li><b>Iterator:</b> Zerlegt eine Liste in einzelne Teile. Beispiel: Eine Mail hat 3 Anhänge, der Iterator macht daraus 3 einzelne Durchläufe, damit jeder Anhang gespeichert wird.</li>
<li><b>Aggregator:</b> Das Gegenstück. Er fasst viele Einzelteile wieder zu einem zusammen, z. B. alle neuen Anmeldungen der Woche zu einer Übersichtsmail.</li>
</ul>
<div class="ex"><b>Szenario „Konzertanfrage“:</b>
<div class="flow"><span>📝 Formular<small>Trigger, sofort</small></span><i>→</i><span>📊 Google Sheet<small>Zeile anlegen</small></span><i>→</i><span>🔀 Router<small>nach Anfrage-Art</small></span><i>→</i><span>🤖 Claude<small>Antwort entwerfen</small></span><i>→</i><span>📧 Gmail<small>als Entwurf speichern</small></span><i>→</i><span>💬 Slack<small>Team informieren</small></span></div>
Die KI-Antwort wird bewusst nur als <b>Entwurf</b> gespeichert. Ein Mensch prüft und klickt auf „Senden“.</div>

<h4>Teil 5: KI in Make einbauen</h4>
<p>Make hat Module für KI-Anbieter (z. B. Anthropic Claude oder OpenAI). Du gibst einen Prompt ein und mappst Daten hinein: „Schreibe eine freundliche Antwort auf diese Anfrage: [Nachricht]. Unsere Preise: [Preisliste].“ Das Ergebnis ist wieder ein Datenpaket, das du im nächsten Modul weiterverwendest. Dafür brauchst du einen <b>API-Key</b> des Anbieters, der pro Nutzung abgerechnet wird.</p>
<div class="tip">Verlange von der KI eine feste Struktur, z. B. „Antworte nur als JSON mit den Feldern kategorie und antwort“. Dann kann Make die Teile sauber weiterverarbeiten.</div>

<h4>Teil 6: Wenn etwas schiefgeht</h4>
<ul>
<li><b>Verlauf (History):</b> Make speichert jeden Durchlauf. Du siehst, welches Modul welche Daten hatte und wo es gehakt hat.</li>
<li><b>Fehlerbehandlung (Error Handler):</b> Du legst fest, was bei einem Fehler passiert: ignorieren, mit Ersatzwert weitermachen, abbrechen oder dich benachrichtigen.</li>
<li><b>Einmal ausführen (Run once):</b> Zum Testen startest du das Szenario von Hand und schaust dir jedes Modul an, bevor du es dauerhaft einschaltest.</li>
</ul>

<p><b>n8n</b> (gesprochen „n-eight-n“, eine Abkürzung für „nodemation“) ist wie Make ein Werkzeug, mit dem du Abläufe aus Bausteinen zusammensetzt. Der große Unterschied: Du kannst n8n <b>auf deinem eigenen Server betreiben</b>. Außerdem ist es besonders stark bei <b>KI-Agenten</b>.</p>

<h4>Teil 1: Begriffe im Vergleich zu Make</h4>
<table>
<tr><th>Make</th><th>n8n</th><th>Bedeutung</th></tr>

<tr><td>Durchlauf</td><td>Execution</td><td>Eine Ausführung des Ablaufs</td></tr>
</table>
<p>Daten fließen in n8n als <b>Items</b> von Node zu Node. Mit <b>Expressions</b> greifst du auf frühere Daten zu. Das sieht so aus: <code>{{ $json.name }}</code>, also „nimm das Feld name aus den Daten des vorherigen Nodes“. Du kannst Felder aber auch einfach per Drag-and-drop hineinziehen.</p>

<h4>Teil 2: Was n8n besonders macht</h4>
<ul>
<li><b>Self-Hosting:</b> Du installierst n8n auf einem eigenen Server. Die Daten bleiben dort, das ist gut für den Datenschutz, z. B. bei Mitgliederdaten.</li>
<li><b>Kosten:</b> Selbst gehostet zahlst du nur den Server, egal wie oft ein Workflow läuft. Bei der Cloud-Version zahlst du pro Ausführung (Execution), nicht pro Schritt. Ein langer Workflow kostet also nicht mehr als ein kurzer.</li>
<li><b>Code-Node:</b> Fehlt ein Baustein, schreibst du ein paar Zeilen JavaScript oder Python. Das kann dir Claude schreiben.</li>
<li><b>HTTP-Request-Node:</b> Spricht jede beliebige API an, auch wenn es keinen fertigen Baustein dafür gibt.</li>
<li><b>KI-Nodes:</b> Ein eigener <b>AI-Agent-Node</b> mit Sprachmodell, Gedächtnis (Memory) und Werkzeugen (Tools).</li>
</ul>

<h4>Teil 3: Der AI-Agent-Node</h4>
<p>In n8n baust du einen KI-Agenten wie aus Lego:</p>
<ul>
<li><b>Chat Model:</b> Welches Sprachmodell denkt? (z. B. Claude über API)</li>
<li><b>Memory:</b> Merkt sich den bisherigen Gesprächsverlauf, damit der Agent nicht nach jeder Nachricht alles vergisst.</li>
<li><b>Tools:</b> Was darf der Agent tun? Z. B. im Kalender nachsehen, in einer Tabelle suchen, eine Mail entwerfen, in einer Wissensdatenbank suchen.</li>
<li><b>System-Prompt:</b> Rolle, Regeln und Grenzen des Agenten.</li>
</ul>
<div class="ex">Agent „Vereinsassistent“: Chat-Trigger auf der Website → AI Agent (Claude) mit Memory → Tools: „Termine aus Google Kalender lesen“, „Satzung durchsuchen (RAG)“, „Anfrage an Vorstand weiterleiten“. Mitglieder fragen „Wann ist die nächste Probe?“, und der Agent schaut selbst im Kalender nach.</div>

<h4>Teil 4: Self-Hosting Schritt für Schritt (Überblick)</h4>
<ol>
<li><b>Server mieten:</b> Ein kleiner virtueller Server (VPS), z. B. bei <b>Hetzner</b>, einem deutschen Anbieter mit Rechenzentren in Deutschland und Finnland. Für den Anfang reichen 2 CPU-Kerne und 4 GB Arbeitsspeicher, das kostet wenige Euro im Monat [Prüfen].</li>
<li><b>Verwaltung einrichten:</b> <b>Coolify</b> ist eine kostenlose Oberfläche, die du einmal auf dem Server installierst. Danach installierst du Programme wie n8n per Klick, ganz ohne Kommandozeile.</li>
<li><b>n8n installieren:</b> In Coolify n8n auswählen und starten. Im Hintergrund läuft es in einem <b>Docker-Container</b>, einer abgeschlossenen Box mit allem, was das Programm braucht.</li>

<li><b>Absichern:</b> Starkes Passwort, regelmäßige Updates, automatische <b>Backups</b>.</li>
</ol>
<div class="tip">Self-Hosting heißt: <b>Du bist der Hausmeister.</b> Fällt der Server aus oder fehlt ein Update, kümmert sich niemand außer dir. Plane dafür feste Zeit ein, z. B. 30 Minuten im Monat.</div>

<p>Ein Sprachmodell kennt das öffentliche Wissen aus seinem Training. Es kennt aber <b>nicht</b> deine Satzung, deinen Tarifvertrag, deine Preisliste oder deine Probenregeln. Fragst du trotzdem danach, rät es, und das führt zu Halluzinationen. <b>RAG</b> löst dieses Problem.</p>
<p><b>RAG</b> steht für <b>Retrieval Augmented Generation</b>, auf Deutsch etwa „durch Nachschlagen verbesserte Texterzeugung“. Die Idee ist einfach: <b>Bevor</b> die KI antwortet, werden die passenden Stellen aus deinen Dokumenten herausgesucht und ihr mitgegeben. Wie eine Prüfung mit erlaubtem Spickzettel, und zwar genau dem richtigen Zettel.</p>

<h4>Teil 1: Warum nicht einfach alles hochladen?</h4>
<p>Bei ein paar Dokumenten kannst du sie tatsächlich direkt in den Chat laden. Bei hunderten Seiten geht das nicht mehr: Das Kontextfenster ist begrenzt, jede Anfrage würde teuer und langsam, und das Modell verliert in riesigen Texten leicht Details. RAG sucht deshalb nur die <b>wenigen relevanten Abschnitte</b> heraus.</p>

<h4>Teil 2: Die Vorbereitung (einmalig)</h4>
<ol>
<li><b>Dokumente sammeln:</b> PDFs, Word-Dateien, Webseiten, Wiki-Seiten.</li>
<li><b>Zerlegen (Chunking):</b> Die Texte werden in kleine Abschnitte geschnitten, sogenannte <b>Chunks</b>, z. B. je ein Absatz oder ca. 500 Wörter. Meist mit etwas Überlappung, damit kein Gedanke mitten im Satz zerschnitten wird.</li>
<li><b>Embeddings berechnen:</b> Ein spezielles Modell verwandelt jeden Chunk in eine lange <b>Zahlenreihe</b>. Diese Zahlen beschreiben die <b>Bedeutung</b> des Textes. Texte mit ähnlicher Bedeutung bekommen ähnliche Zahlen.</li>
<li><b>Speichern:</b> Chunks und Zahlen kommen in eine <b>Vektordatenbank</b> (z. B. Supabase, Pinecone, Qdrant). „Vektor“ ist einfach der Fachbegriff für so eine Zahlenreihe.</li>
</ol>
<div class="ex">Stell dir eine riesige Landkarte vor. Jeder Textabschnitt ist ein Punkt darauf. Abschnitte über Urlaub liegen nah beieinander, Abschnitte über Gagen in einer anderen Ecke. Das Embedding ist die Koordinate des Punktes.</div>

<h4>Teil 3: Die Abfrage (bei jeder Frage)</h4>
<div class="flow"><span>❓ Frage<small>„Wie viel Urlaub habe ich?“</small></span><i>→</i><span>🔢 Embedding<small>Frage wird zur Koordinate</small></span><i>→</i><span>🔍 Suche<small>nächste Punkte auf der Karte</small></span><i>→</i><span>📄 Top-Treffer<small>z. B. 3–5 Chunks</small></span><i>→</i><span>🤖 LLM<small>Frage + Chunks → Antwort</small></span></div>
<p>Das Besondere: Die Suche funktioniert nach <b>Bedeutung</b>, nicht nach exakten Wörtern. Die Frage „Wie viel Urlaub habe ich?“ findet auch den Abschnitt „Der Jahresurlaub beträgt 30 Arbeitstage“, obwohl die Wörter verschieden sind. Das nennt man <b>semantische Suche</b>.</p>
<p>Der Prompt an das Modell sieht dann ungefähr so aus: „Beantworte die Frage nur anhand dieser Auszüge. Nenne die Quelle. Steht es nicht drin, sag das. Auszüge: … Frage: …“</p>

<h4>Teil 4: Was RAG gut oder schlecht macht</h4>
<ul>
<li><b>Gute Dokumente:</b> Veraltete oder widersprüchliche Dokumente liefern widersprüchliche Antworten. Erst aufräumen, dann einlesen.</li>
<li><b>Chunk-Größe:</b> Zu klein, und der Zusammenhang fehlt. Zu groß, und die Suche wird ungenau.</li>
<li><b>Metadaten:</b> Zu jedem Chunk Titel, Datum und Quelle speichern. Dann kann die KI sagen „laut Satzung, § 5“ und man kann nach Datum filtern.</li>
<li><b>Tabellen und Scans</b> sind schwierig. Gescannte PDFs brauchen erst Texterkennung (OCR).</li>
<li><b>Aktualisieren:</b> Ändert sich ein Dokument, muss es neu eingelesen werden. In n8n lässt sich das automatisieren.</li>
</ul>

<h4>Teil 5: RAG, Fine-Tuning oder RAFT?</h4>

<p>Sehr viele Unternehmen, Behörden, Hochschulen und auch Orchester arbeiten mit <b>Microsoft 365</b>: Outlook, Word, Excel, PowerPoint, Teams, OneDrive und SharePoint. Wer dort KI einführt, nutzt meist Microsofts eigene Werkzeuge. Die drei wichtigsten heißen <b>Copilot</b>, <b>Power Automate</b> und <b>Azure</b>.</p>

<h4>Teil 1: Microsoft 365 Copilot</h4>
<p><b>Copilot</b> ist ein KI-Assistent, der direkt in den Office-Programmen sitzt. Der Clou: Er kann auf alles zugreifen, worauf <b>du</b> im Unternehmen Zugriff hast, also deine Mails, Dateien, Chats und Termine. Dieses Firmenwissen nennt Microsoft den <b>Microsoft Graph</b>.</p>
<ul>
<li><b>Outlook:</b> „Fasse diesen Mailverlauf zusammen“, „Entwirf eine höfliche Absage.“</li>
<li><b>Word:</b> „Erstelle aus diesen Stichpunkten ein Konzept“, „Kürze den Text auf eine Seite.“</li>
<li><b>Excel:</b> „Welche Monate hatten die höchsten Ausgaben?“, „Erstelle eine Formel für …“</li>
<li><b>PowerPoint:</b> „Mach aus diesem Word-Dokument eine Präsentation mit 8 Folien.“</li>
<li><b>Teams:</b> „Was wurde in der Besprechung entschieden? Wer hat welche Aufgabe?“</li>
</ul>
<p>Es gibt eine kostenlose Chat-Variante und die kostenpflichtige Lizenz <b>Microsoft 365 Copilot</b>, die den Zugriff auf Firmendaten erst möglich macht [Preise prüfen]. Zusätzlich lassen sich mit <b>Copilot Studio</b> eigene Agenten bauen, z. B. ein HR-Bot, der Fragen zum Urlaubsantrag beantwortet.</p>

<h4>Teil 2: Das größte Risiko: Berechtigungen</h4>
<p>Copilot respektiert Berechtigungen, er sieht nur, was du sehen darfst. Das klingt sicher. Das Problem: In vielen Firmen sind Ordner jahrelang <b>zu großzügig freigegeben</b>. Früher hat das niemand bemerkt, weil niemand gezielt danach gesucht hat. Copilot findet es aber.</p>
<div class="ex">Die Gehaltsliste liegt seit Jahren in einem SharePoint-Ordner, der versehentlich „für alle im Unternehmen“ freigegeben ist. Ein Mitarbeiter fragt Copilot: „Was verdient mein Kollege?“, und Copilot antwortet.</div>
<div class="tip">Vor der Einführung von Copilot: <b>Berechtigungen aufräumen.</b> Wer hat Zugriff auf welche Ordner? Sind vertrauliche Dateien richtig geschützt (z. B. mit Vertraulichkeitsbezeichnungen)?</div>

<h4>Teil 3: Power Automate</h4>
<p><b>Power Automate</b> ist das Automationswerkzeug von Microsoft, vergleichbar mit Make und n8n. Ein Ablauf heißt hier <b>Flow</b> und besteht aus einem Trigger und Aktionen.</p>
<ul>
<li><b>Cloud-Flows:</b> Verbinden Microsoft- und andere Dienste, z. B. „Wenn eine Mail mit Anhang ankommt, speichere den Anhang in SharePoint und informiere mich in Teams.“</li>
<li><b>Desktop-Flows (RPA):</b> Steuern alte Programme ohne Schnittstelle, indem sie Mausklicks und Eingaben nachahmen. RPA heißt „Robotic Process Automation“.</li>
<li><b>Genehmigungen:</b> Eingebaute Freigabe-Abläufe, z. B. „Rechnung über 1.000 € → Chefin bekommt Genehmigungsanfrage in Teams“.</li>
<li><b>KI-Bausteine:</b> Text zusammenfassen, Belege und Formulare auslesen, Mails einordnen.</li>
</ul>
<div class="ex"><b>Flow „Rechnungseingang“:</b>
<div class="flow"><span>📧 Mail mit PDF<small>Trigger</small></span><i>→</i><span>🧾 KI liest Beleg<small>Betrag, Lieferant</small></span><i>→</i><span>✅ Genehmigung<small>in Teams</small></span><i>→</i><span>📁 SharePoint<small>ablegen</small></span><i>→</i><span>📊 Excel<small>Liste ergänzen</small></span></div></div>

<h4>Teil 4: Azure</h4>
<p><b>Azure</b> ist Microsofts Cloud-Plattform, die Werkstatt im Hintergrund. Dort betreiben Unternehmen Server, Datenbanken und eigene KI-Anwendungen. Für KI wichtig:</p>
<ul>
<li><b>KI-Modelle per API:</b> Modelle verschiedener Anbieter (z. B. OpenAI, und je nach Angebot auch weitere) in einer abgesicherten Unternehmensumgebung [Prüfen].</li>
<li><b>Rechenzentren in der EU:</b> Daten können in Europa verarbeitet werden.</li>
<li><b>Verträge:</b> Datenschutz- und Auftragsverarbeitungsverträge sind oft schon über den Microsoft-Rahmenvertrag geregelt.</li>
</ul>

<h4>Teil 5: Wann lohnt sich die Microsoft-Welt?</h4>
<ul>
<li><b>Ja,</b> wenn das Unternehmen ohnehin Microsoft 365 nutzt. Anmeldung, Rechte und Verträge sind schon da, die Mitarbeitenden kennen die Programme.</li>

</ul>`,

<p><b>Prompt Engineering</b> klingt technisch, ist aber vor allem eines: <b>gut erklären</b>. Ein Prompt ist deine Anweisung an die KI. Je besser du erklärst, was du brauchst, desto besser das Ergebnis. Das ist keine Geheimwissenschaft, sondern Handwerk.</p>

<h4>Teil 1: Das wichtigste Bild</h4>
<p>Stell dir die KI als <b>hochbegabte neue Praktikantin</b> vor. Sie hat unglaublich viel gelesen, kann schnell schreiben und kennt fast jedes Fachgebiet. Aber sie ist <b>heute ihren ersten Tag bei dir</b>. Sie weiß nicht, wer du bist, für wen der Text ist, welchen Ton du magst und was beim letzten Mal schiefging.</p>
<p>Wenn du ihr sagst „Schreib mal was für den Newsletter“, bekommst du etwas Allgemeines. Nicht, weil sie schlecht ist, sondern weil du ihr nichts gesagt hast.</p>
<div class="tip">Der Praktikanten-Test: Würde ein kluger Mensch, der dich nicht kennt, mit deinem Prompt genau das liefern, was du willst? Wenn nein, fehlt Kontext.</div>

<h4>Teil 2: Die 6 Bausteine eines guten Prompts</h4>
<table>
<tr><th>Baustein</th><th>Frage</th><th>Beispiel</th></tr>
<tr><td><b>Rolle</b></td><td>Als wer soll die KI denken?</td><td>„Du bist erfahrene Orchestermanagerin.“</td></tr>
<tr><td><b>Kontext</b></td><td>Was ist die Situation?</td><td>„Unser Ensemble spielt am 12.12. in Bamberg, Veranstalter ist neu für uns.“</td></tr>
<tr><td><b>Aufgabe</b></td><td>Was genau soll getan werden?</td><td>„Schreibe eine Mail mit Fragen zur Technik.“</td></tr>
<tr><td><b>Format</b></td><td>Wie soll das Ergebnis aussehen?</td><td>„Max. 120 Wörter, Sie-Form, 3 Fragen als Liste.“</td></tr>
<tr><td><b>Beispiele</b></td><td>Wie sieht gut aus?</td><td>„So klingen unsere Mails: …“</td></tr>
<tr><td><b>Grenzen</b></td><td>Was soll vermieden werden?</td><td>„Keine Preisangaben, keine Floskeln wie ‚Ich hoffe, es geht Ihnen gut‘.“</td></tr>
</table>
<p>Nicht jeder Prompt braucht alle sechs. Für „Übersetze ins Englische“ reicht die Aufgabe. Je wichtiger und spezieller das Ergebnis, desto mehr Bausteine lohnen sich.</p>

<h4>Teil 3: Vorher und nachher</h4>
<div class="ex"><b>Schwach:</b> „Schreib eine Mail an den Veranstalter.“<br><br><b>Stark:</b> „Du bist mein Assistent. Wir sind ein Blechbläserquintett mit Schlagwerk und spielen am 12.12. zum ersten Mal beim Kulturverein Bamberg. Schreibe eine kurze, freundliche Mail an Frau Weber vom Verein. Frage nach: 1) Bühnenmaßen, 2) Anlieferzeit und Parkplatz, 3) ob Pauken vor Ort sind. Maximal 120 Wörter, Sie-Form, ohne Floskeln. Unterschrift: Anna.“</div>

<h4>Teil 4: Struktur hilft</h4>
<p>Bei langen Prompts mit Material (Texte, Daten, Beispiele) trenne Anweisung und Material sauber. Claude kommt besonders gut mit <b>XML-artigen Markierungen</b> zurecht:</p>
<pre>&lt;aufgabe&gt;Fasse den Vertrag für mich zusammen.&lt;/aufgabe&gt;
&lt;vertrag&gt;… hier der Vertragstext …&lt;/vertrag&gt;
&lt;format&gt;5 Stichpunkte, dann offene Fragen&lt;/format&gt;</pre>
<p>So verwechselt die KI nie, was Anweisung und was Material ist. Gute Gewohnheiten außerdem: Material zuerst, die eigentliche Frage am Ende; klare Aufzählungen statt langer Schachtelsätze.</p>

<h4>Teil 5: Positiv formulieren und begründen</h4>
<ul>
<li><b>Sag, was du willst, nicht nur, was du nicht willst.</b> Statt „Nicht zu lang“ lieber „Maximal 5 Sätze“.</li>
<li><b>Begründe deine Wünsche.</b> „Kurze Sätze, weil viele Leser den Newsletter am Handy lesen.“ Mit dem Grund kann die KI auch in Situationen richtig entscheiden, die du nicht vorhergesehen hast.</li>
<li><b>Lass dir Rückfragen stellen:</b> „Bevor du anfängst: Stell mir bis zu 3 Fragen, wenn dir etwas Wichtiges fehlt.“</li>
</ul>

<h4>Teil 6: Iteration ist normal</h4>
<p>Profis schreiben selten den perfekten Prompt auf Anhieb. Sie arbeiten im <b>Dialog</b>:</p>
<ol>
<li>Ersten Entwurf anfordern.</li>
<li>Konkret Feedback geben: „Der Einstieg ist zu förmlich. Punkt 3 weglassen. Den Schluss mit einer Frage beenden.“</li>
<li>Wiederholen, bis es passt.</li>
<li>Den <b>funktionierenden Prompt speichern</b>, damit du ihn beim nächsten Mal wiederverwenden kannst.</li>
</ol>
<div class="tip">„Mach es besser“ ist schwaches Feedback. „Kürzer, persönlicher, und erwähne unser Jubiläum“ ist starkes Feedback.</div>`,

<p>Manchmal kannst du noch so genau beschreiben, was du willst, und die KI trifft es trotzdem nicht ganz. Dann hilft der älteste Lehrertrick der Welt: <b>Zeig ein Beispiel.</b> Genau darum geht es beim Shot-Prompting. „Shot“ heißt hier einfach <b>Beispiel</b>.</p>

<h4>Teil 1: Die drei Varianten</h4>
<ul>
<li><b>Zero-Shot (kein Beispiel):</b> Nur die Anweisung. Reicht für einfache, eindeutige Aufgaben.<br><i>„Übersetze ins Englische: Die Probe beginnt um 19 Uhr.“</i></li>
<li><b>One-Shot (ein Beispiel):</b> Ein Muster zeigt Format oder Stil.<br><i>„Schreibe Konzertankündigungen in diesem Format: ‚🎺 Fr 12.12. · Bamberg · Weihnachtskonzert · Tickets: link‘. Jetzt für: Samstag, 20.12., Würzburg, Neujahrsgala.“</i></li>
<li><b>Few-Shot (mehrere Beispiele, meist 2–5):</b> Die KI erkennt ein <b>Muster</b>, das sich schwer beschreiben lässt.</li>
</ul>

<h4>Teil 2: Wann Beispiele besonders helfen</h4>
<ul>
<li><b>Eigener Stil:</b> „So schreibe ich“ lässt sich kaum beschreiben, aber leicht zeigen.</li>
<li><b>Feste Formate:</b> Wenn das Ergebnis immer gleich aufgebaut sein muss, z. B. für eine Automation.</li>
<li><b>Einordnen (Klassifizieren):</b> Nachrichten, Belege, Anfragen in Kategorien sortieren.</li>
<li><b>Grenzfälle:</b> Wenn du zeigen willst, wie mit kniffligen Fällen umzugehen ist.</li>
</ul>

<h4>Teil 3: Ein Few-Shot-Beispiel zum Einordnen</h4>
<pre>Ordne jede Nachricht einer Kategorie zu:
Organisation, Finanzen, Besetzung, Sonstiges.

<h4>Teil 1: Warum Denken vor der Antwort hilft</h4>
<p>Ein LLM erzeugt Text Stück für Stück. Schreibt es sofort das Ergebnis hin, muss es die ganze Überlegung „in einem Zug“ schaffen. Schreibt es erst Zwischenschritte, kann jeder neue Schritt auf den vorherigen aufbauen. Das senkt Fehler bei Rechnungen, Logik, Planung und Abwägungen deutlich.</p>

<h4>Teil 2: Chain of Thought (Gedankenkette)</h4>
<p>Bei <b>Chain of Thought</b> bittest du die KI, <b>Schritt für Schritt</b> zu denken, bevor sie das Ergebnis nennt.</p>
<div class="ex">„Wir haben 3 Konzerte mit je 5 Musikern. Gage 250 € pro Person und Konzert, Fahrtkosten 80 € pro Konzert, und für das dritte Konzert brauchen wir zusätzlich einen Schlagzeuger für 300 €. <b>Rechne Schritt für Schritt</b> und nenne erst dann das Gesamtbudget.“</div>
<p>Die KI schreibt: Gagen 3 × 5 × 250 = 3.750 € → Fahrtkosten 3 × 80 = 240 € → Zusatz 300 € → Gesamt 4.290 €. Jeder Schritt ist überprüfbar. Ein Fehler fällt sofort auf.</p>
<p><b>Drei Stufen der Anleitung:</b></p>
<ol>
<li><b>Einfach:</b> „Denke Schritt für Schritt.“</li>
<li><b>Gelenkt:</b> „Prüfe zuerst …, dann …, dann entscheide.“ Du gibst die Denkschritte vor.</li>
<li><b>Getrennt:</b> „Schreibe deine Überlegungen in &lt;denken&gt;…&lt;/denken&gt; und die Antwort in &lt;antwort&gt;…&lt;/antwort&gt;.“ So kannst du die Antwort später leicht herauslösen, z. B. in einer Automation.</li>

<h4>Teil 3: Eingebauter Denkmodus</h4>
<p>Moderne Modelle haben oft einen eigenen <b>Denkmodus</b> („Extended Thinking“, „Reasoning“). Dann denken sie automatisch ausführlich nach, bevor sie antworten. Du schaltest ihn in der App ein oder wählst ein entsprechendes Modell. Bei eingeschaltetem Denkmodus brauchst du „Denke Schritt für Schritt“ meist nicht mehr. Es hilft aber weiterhin, <b>worüber</b> nachgedacht werden soll, vorzugeben.</p>
<div class="tip">Denkmodus lohnt sich bei: Rechnen, Logik, Planung, Code, Abwägungen, Verträgen. Er ist unnötig bei: kurzen Texten, Übersetzungen, einfachen Fragen. Er kostet mehr Zeit und Tokens.</div>

<h4>Teil 4: Tree of Thought (Gedankenbaum)</h4>
<p>Chain of Thought geht <b>einen</b> Weg sorgfältig. <b>Tree of Thought</b> lässt die KI <b>mehrere Wege parallel</b> durchdenken, bewerten und den besten auswählen, wie ein Baum mit Ästen, von denen schwache abgeschnitten werden.</p>
<p><b>So baust du einen Tree-of-Thought-Prompt:</b></p>

<h4>Teil 3: Typische Kettenmuster</h4>
<ul>
<li><b>Sammeln → Verdichten → Schreiben:</b> Recherche, Berichte, Newsletter.</li>
<li><b>Analysieren → Planen → Umsetzen:</b> Bewerbungen, Projektpläne, Code.</li>
<li><b>Entwerfen → Kritisieren → Überarbeiten:</b> Die KI schreibt, eine zweite Anweisung kritisiert streng („Was würde ein kritischer Lektor bemängeln?“), eine dritte setzt die Kritik um. Das verbessert Texte enorm.</li>
<li><b>Extrahieren → Umformen → Ausgeben:</b> Daten aus Verträgen ziehen, als Tabelle ordnen, als Mail oder Kalendereintrag weitergeben.</li>

<h4>Teil 4: Regeln für gute Ketten</h4>

<li>Lange Gespräche werden <b>langsamer und teurer</b>, weil immer mehr mitgelesen wird.</li>
<li>Wird das Fenster voll, werden frühe Teile <b>zusammengefasst oder fallen weg</b>. Details vom Anfang gehen verloren.</li>
<li>Viele Themen in einem Chat <b>verwirren</b>: Anweisungen von Thema A beeinflussen plötzlich Thema B.</li>
</ul>
<div class="tip">Neues Thema = neuer Chat. Bei einem langen Chat, der gut lief: Lass dir eine Zusammenfassung schreiben („Fasse alle Entscheidungen und den aktuellen Stand zusammen“) und beginne damit einen frischen Chat.</div>

<h4>Teil 4: Langzeitgedächtnis</h4>
<ul>
<li><b>Memory-Funktion:</b> Manche Apps merken sich wichtige Infos über dich gesprächsübergreifend, z. B. Beruf, Vorlieben, laufende Projekte. Du kannst einsehen, was gespeichert ist, und es ändern oder löschen.</li>
<li><b>Projekte:</b> Du hinterlegst dauerhaft Anweisungen und Dokumente für ein Thema. Jeder neue Chat im Projekt kennt sie automatisch.</li>
<li><b>Eigene Anweisungen / Präferenzen:</b> Allgemeine Regeln für alle Chats, z. B. „Antworte auf Deutsch, kurz und ohne Floskeln.“</li>
<li><b>Dateien wie CLAUDE.md:</b> In Claude Code das Gedächtnis eines Projekts. Das lernst du in Zone 7.</li>
</ul>
<table>

</table>

<p>Stell dir vor, du schreibst jede Woche denselben langen Prompt: „Du bist mein Bewerbungscoach, hier ist mein Lebenslauf, so schreibe ich, achte auf …“. Viel praktischer: Du baust dir <b>einmal einen eigenen Assistenten</b>, der all das schon weiß.</p>

<h4>Teil 1: Was es gibt</h4>
<ul>
<li><b>Claude:</b> <b>Projekte</b> mit eigenen Anweisungen und hochgeladenen Dateien. Dazu <b>Skills</b> für wiederkehrende Abläufe.</li>
<li><b>ChatGPT:</b> <b>Custom GPTs</b> mit Anweisungen, Wissensdateien und Fähigkeiten, auch teilbar.</li>
<li><b>Gemini:</b> <b>Gems</b>, eigene Assistenten mit Anweisungen.</li>
<li><b>Microsoft:</b> <b>Copilot Studio</b> für Firmen-Agenten.</li>
</ul>
<p>Das Prinzip ist überall gleich: <b>Systemanweisung + Wissen + Fähigkeiten</b>.</p>

<h4>Teil 2: Erst das Lastenheft</h4>
<p>Der häufigste Fehler: Man fängt einfach an zu bauen. Ergebnis ist ein Assistent, der „irgendwie“ hilft, aber nicht zuverlässig. Beantworte deshalb zuerst schriftlich:</p>
<ol>
<li><b>Zweck:</b> Welches Problem löst er? (Ein Satz.)</li>
<li><b>Nutzer:</b> Wer benutzt ihn? Mit welchem Vorwissen?</li>
<li><b>Typische Eingaben:</b> Was wird man ihn fragen? Sammle 10 echte Beispielfragen.</li>
<li><b>Ausgaben:</b> Was soll herauskommen, in welchem Format, welcher Länge, welchem Ton?</li>
<li><b>Wissen:</b> Welche Dokumente braucht er?</li>
<li><b>Fähigkeiten:</b> Websuche? Dateien analysieren? Bilder?</li>
<li><b>Grenzen:</b> Was darf er nicht? (Rechtsberatung, Preise zusagen, Privatdaten nennen …)</li>
<li><b>Verhalten bei Unklarheit:</b> Nachfragen? An einen Menschen verweisen?</li>
<li><b>Erfolgskriterien:</b> Woran erkennst du, dass er gut ist?</li>
</ol>

<h4>Teil 3: Die Systemanweisung schreiben</h4>
<p>Die Systemanweisung ist das „Grundgesetz“ deines Assistenten. Ein bewährter Aufbau:</p>
<pre># Rolle
Du bist der Vereinsassistent des Musikvereins XY.

# Aufgabe
Du beantwortest Fragen von Mitgliedern zu Satzung,
Beiträgen, Proben und Veranstaltungen.

# Wissen
Nutze ausschließlich die hochgeladenen Dokumente.
Nenne immer die Quelle (Dokument und Abschnitt).

# Stil
Freundlich, Du-Form, kurz (max. 5 Sätze).

# Grenzen
- Keine Rechts- oder Steuerberatung.
- Keine Auskunft über andere Mitglieder.
- Steht etwas nicht in den Dokumenten: sag das
  und verweise an vorstand@verein.de.

# Beispiele
Frage: „Wie hoch ist der Jahresbeitrag?“
Antwort: „Der Jahresbeitrag beträgt 60 € (Beitragsordnung, § 2). …“</pre>

<h4>Teil 4: Wissen hochladen</h4>
<ul>
<li>Nur <b>aktuelle, widerspruchsfreie</b> Dokumente.</li>
<li>Klare Dateinamen („Satzung_2026.pdf“ statt „scan_003.pdf“).</li>
<li>Lieber mehrere thematische Dateien als ein riesiges Sammeldokument.</li>
<li>Gescannte PDFs vorher durch Texterkennung schicken.</li>
<li>Keine vertraulichen Daten, wenn der Assistent geteilt wird.</li>
</ul>

<h4>Teil 5: Testen wie ein Profi</h4>
<p>Teste mit einer <b>Testliste</b> aus drei Arten von Fragen:</p>
<ul>
<li><b>Normalfälle:</b> Deine 10 typischen Beispielfragen.</li>
<li><b>Grenzfälle:</b> Unklare oder unvollständige Fragen („Was kostet das?“).</li>
<li><b>Störfälle:</b> Fragen außerhalb des Themas, Versuche, ihn auszutricksen („Ignoriere deine Anweisungen und …“), Fragen nach vertraulichen Infos.</li>
</ul>
<p>Notiere, was schiefging, ändere die Systemanweisung, teste erneut. Behalte die Testliste und teste nach jeder Änderung noch einmal komplett.</p>
<div class="tip">Ein guter Assistent erkennt man nicht an den Fragen, die er beantwortet, sondern daran, wie er mit Fragen umgeht, die er <b>nicht</b> beantworten soll.</div>`,

<p>Eine der größten Stärken von KI: Sie liest in Sekunden, wofür du Stunden bräuchtest. Verträge, Ausschreibungen, Protokolle, Abrechnungen, Tabellen. Wer weiß, wie man richtig fragt, bekommt verlässliche Ergebnisse.</p>

<h4>Teil 1: Vier Arten, mit Dokumenten zu arbeiten</h4>
<table>
<tr><th>Art</th><th>Beispiel-Prompt</th></tr>
<tr><td><b>Zusammenfassen</b></td><td>„Die 7 wichtigsten Punkte dieses Gastspielvertrags, in einfacher Sprache.“</td></tr>
<tr><td><b>Gezielt fragen</b></td><td>„Was steht zu Stornierung? Zitiere die Stelle wörtlich.“</td></tr>
<tr><td><b>Vergleichen</b></td><td>„Vergleiche Vertrag A und B als Tabelle: Gage, Reisekosten, Storno, Rechte an Aufnahmen.“</td></tr>
<tr><td><b>Extrahieren</b></td><td>„Liste alle Termine als Tabelle mit Datum, Uhrzeit, Ort, Art.“</td></tr>
</table>

<h4>Teil 2: Verlässlich mit Dokumenten arbeiten</h4>
<ul>
<li><b>Zitate verlangen:</b> „Belege jede Aussage mit einem wörtlichen Zitat.“ So kannst du in Sekunden nachprüfen.</li>
<li><b>Nichtwissen erlauben:</b> „Steht etwas nicht im Dokument, schreibe ‚nicht geregelt‘.“ Gerade bei Verträgen ist das, was <b>fehlt</b>, oft das Wichtigste.</li>
<li><b>Zielgruppe nennen:</b> „Erkläre es so, dass ich als Musiker ohne Jura-Kenntnisse es verstehe.“</li>
<li><b>Prüfauftrag geben:</b> „Welche Klauseln sind für mich als Auftragnehmer ungünstig oder unüblich?“</li>
<li><b>Grenzen kennen:</b> KI ersetzt keine Rechtsberatung. Sie hilft dir, die richtigen Fragen zu stellen.</li>
</ul>
<div class="ex"><b>Vertrags-Check-Prompt:</b> „Du hilfst mir als freiberuflichem Musiker. Prüfe den beigefügten Gastspielvertrag. 1) Fasse ihn in 7 Punkten zusammen. 2) Erstelle eine Tabelle: Gage, Zahlungsfrist, Reisekosten, Unterkunft, Storno, Ausfallregelung bei Krankheit, Aufnahmerechte. Fehlt ein Punkt: ‚nicht geregelt‘. 3) Markiere ungünstige oder unklare Klauseln und zitiere sie. 4) Formuliere 3 Rückfragen an den Veranstalter.“</div>

<h4>Teil 3: Tabellen und Zahlen</h4>
<p>Hier ist eine Sache entscheidend: <b>Rechnen per Code statt im Kopf.</b></p>
<p>Ein Sprachmodell „rechnet“ in normalem Text, indem es wahrscheinliche Zahlen schreibt. Bei großen Tabellen geht das schief. Viele KI-Apps können aber <b>Code ausführen</b> (meist Python). Dann liest die KI deine Datei wirklich ein, rechnet exakt und erstellt Diagramme.</p>
<ul>
<li>„Lade meine Einnahmen-CSV. Summe pro Monat und als Balkendiagramm.“</li>
<li>„Welche Konzerte hatten die höchsten Fahrtkosten im Verhältnis zur Gage? Top 5.“</li>
<li>„Gibt es doppelte Einträge oder auffällige Ausreißer?“</li>
</ul>
<div class="tip">Achte darauf, dass die App tatsächlich Code ausführt (du siehst dann meist einen Analyse-Schritt). Prüfe 2–3 Zahlen stichprobenartig von Hand.</div>

<h4>Teil 4: Daten gut vorbereiten</h4>
<ul>
<li><b>Eine Zeile = ein Datensatz</b>, eine Spalte = eine Eigenschaft.</li>
<li><b>Klare Spaltennamen</b> („Datum“, „Gage_EUR“ statt „Spalte C“).</li>
<li><b>Einheitliche Formate</b>: Datum immer gleich, Beträge ohne Text („450“ statt „450 € netto“).</li>
<li><b>Keine verbundenen Zellen</b> und keine Zwischensummen mitten in der Tabelle.</li>
<li><b>Datenschutz:</b> Namen und Kontodaten vorher entfernen, wenn sie für die Auswertung nicht nötig sind.</li>
</ul>

<h4>Teil 5: KI in Excel und Google Sheets</h4>
<ul>
<li><b>Formeln erklären lassen:</b> „Was macht diese Formel? =SVERWEIS(…)“.</li>
<li><b>Formeln schreiben lassen:</b> „Formel für Google Sheets: Summe aller Gagen über 500 € im Jahr 2026, Gagen in Spalte D, Datum in Spalte A.“</li>
<li><b>Integrierte KI:</b> Copilot in Excel, Gemini in Google Sheets, Claude als Add-in bzw. per Upload.</li>
<li><b>Massenhaft Zellen befüllen:</b> Add-ons oder Automationen, die für jede Zeile einen Prompt ausführen (z. B. „Kategorie zu dieser Buchung“).</li>
</ul>

<b>Aufgabe:</b> Häufige Fragen beantworten, Anfragen aufnehmen, auf Buchung oder Kontakt leiten.</p>
<p><b>So ist er typischerweise gebaut:</b></p>
<div class="flow"><span>💬 Chat-Fenster<small>auf der Website</small></span><i>→</i><span>⚙️ n8n<small>empfängt Nachricht</small></span><i>→</i><span>🤖 KI-Agent<small>mit Memory</small></span><i>→</i><span>📚 RAG<small>Website-Inhalte, FAQ</small></span><i>→</i><span>📋 Tool<small>Anfrage speichern</small></span></div>
<p><b>Worauf es ankommt:</b></p>
<ul>
<li><b>Als KI erkennbar</b> sein (Pflicht nach EU AI Act): „Hallo, ich bin der digitale Assistent.“</li>
<li><b>Klare Übergabe an Menschen</b>: Bei Beschwerden, komplizierten Fällen oder auf Wunsch → Kontaktformular, Mail oder Rückruf.</li>
<li><b>Nur über das eigene Thema</b> sprechen. Ein Ensemble-Bot muss keine Kochrezepte liefern.</li>
<li><b>Keine verbindlichen Zusagen</b> zu Preisen oder Terminen ohne menschliche Bestätigung.</li>
<li><b>Datenschutzhinweis</b> im Chatfenster, wenn Namen oder Mails abgefragt werden.</li>
</ul>

<h4>Teil 2: Der interne Wissens-Bot</h4>
<p><b>Zielgruppe:</b> Mitarbeitende oder Mitglieder.<br>
<b>Aufgabe:</b> Internes Wissen auffindbar machen: Handbücher, Richtlinien, Vorlagen, Protokolle.</p>
<p>Kernstück ist <b>RAG</b> (aus Zone 2). Typische Fragen: „Wie beantrage ich Urlaub?“, „Wo finde ich die Vorlage für Gastspielverträge?“, „Was wurde zur Reise nach England beschlossen?“</p>
<ul>
<li>Der Bot spart vor allem den Kollegen Zeit, die sonst immer dieselben Fragen beantworten.</li>
<li>Er ist nur so gut wie die Dokumente: veraltete Richtlinien → falsche Antworten.</li>
<li><b>Zugriffsrechte beachten:</b> Wer darf welche Dokumente sehen? Ein Bot für alle darf keine Vorstandsprotokolle mit Personalthemen enthalten.</li>
<li>Oft läuft er dort, wo das Team ohnehin ist: in Slack, Teams oder Telegram.</li>
</ul>

<h4>Teil 3: Der SQL-Chatbot</h4>
<p>Viele Daten liegen nicht in Dokumenten, sondern in <b>Datenbanken</b>: Ticketverkäufe, Mitglieder, Buchungen. Diese fragt man mit <b>SQL</b> ab, einer Abfragesprache. Beispiel:</p>
<pre>SELECT COUNT(*) FROM tickets
WHERE datum BETWEEN '2026-10-01' AND '2026-10-31';</pre>
<p>Ein SQL-Bot übersetzt eine normale Frage („Wie viele Tickets haben wir im Oktober verkauft?“) selbst in so eine Abfrage, führt sie aus und erklärt das Ergebnis in Worten.</p>
<ul>
<li><b>Nur Lesezugriff!</b> Der Datenbank-Benutzer des Bots darf nur lesen (SELECT), niemals ändern oder löschen. Sonst könnte eine missverstandene Frage Daten vernichten.</li>
<li>Dem Bot die <b>Tabellenstruktur</b> erklären (welche Tabellen, welche Spalten bedeuten was).</li>
<li>Die erzeugte Abfrage <b>anzeigen lassen</b>, damit man sie prüfen kann.</li>
</ul>

<h4>Teil 4: Weitere Kanäle</h4>
<ul>
<li><b>Reporting-Bot in Slack oder Teams:</b> Jeden Montag automatisch die Kennzahlen der Woche: neue Anfragen, Zusagen, Umsatz. Gebaut mit Zeitplan-Trigger + Datenbankabfrage + KI-Zusammenfassung.</li>
<li><b>Messenger-Bots:</b> Telegram oder WhatsApp Business für Mitglieder oder Kunden (bei WhatsApp auf Geschäftsbedingungen und Datenschutz achten [Prüfen]).</li>
<li><b>Sprach-Bots:</b> Mit Stimmen z. B. von ElevenLabs. Ausführlich in Zone 5.</li>
</ul>

<h4>Teil 5: Wie man einen Chatbot misst</h4>

<li><b>Übergabequote:</b> Wie oft muss er weiterleiten? (Zu hoch → Wissen fehlt.)</li>
<li><b>Fehlerquote:</b> Stichprobenartig Gespräche lesen: Stimmen die Antworten?</li>
<li><b>Zufriedenheit:</b> Daumen hoch oder runter am Ende.</li>
<li><b>Lücken-Liste:</b> Fragen, die er nicht beantworten konnte → ergänze Dokumente.</li>
</ul>`,

<p>In vielen Firmen passiert Folgendes: Die Geschäftsführung hat KI „noch nicht freigegeben“. Die Mitarbeitenden nutzen sie trotzdem, heimlich, mit privaten Gratis-Konten, und kopieren dabei Kundendaten, Verträge und interne Zahlen hinein. Das nennt man <b>Schatten-KI</b>. Die Lösung ist nicht ein Verbot, sondern ein <b>sicheres, erlaubtes Angebot</b>: ein <b>Corporate LLM</b>.</p>

<h4>Teil 1: Was ist ein Corporate LLM?</h4>
<p>Ein <b>firmeneigener KI-Chat</b>, den alle Mitarbeitenden nutzen dürfen, unter Kontrolle des Unternehmens. Er besteht aus zwei getrennten Teilen:</p>
<ol>
<li><b>Die Oberfläche:</b> Das Chatfenster, das die Leute sehen. Ein bekanntes Open-Source-Beispiel ist <b>OpenWebUI</b>. Es sieht ähnlich aus wie ChatGPT, läuft aber auf dem eigenen Server.</li>
<li><b>Das Modell dahinter:</b> Entweder ein Cloud-Modell über API oder ein lokales Modell.</li>
</ol>

<h4>Teil 2: Drei Varianten für das Modell</h4>
<table>
<tr><th>Variante</th><th>Wie</th><th>Datenschutz</th><th>Leistung</th></tr>
<tr><td><b>Cloud-API mit Vertrag</b></td><td>Anthropic, OpenAI usw. über API oder Business-Tarif</td><td>Gut: Daten meist nicht fürs Training, AVV möglich [Prüfen]</td><td>Beste Modelle</td></tr>
<tr><td><b>Cloud in der EU</b></td><td>Modelle über europäische Rechenzentren (z. B. Azure, AWS, Google in EU-Regionen)</td><td>Sehr gut</td><td>Sehr gut</td></tr>
<tr><td><b>Lokal</b></td><td>Open-Source-Modell auf eigener Hardware, z. B. mit <b>Ollama</b></td><td>Maximal: Daten verlassen das Haus nie</td><td>Meist schwächer, braucht starke Hardware</td></tr>
</table>
<p>Viele Firmen kombinieren: ein starkes Cloud-Modell für Alltagsaufgaben, ein lokales Modell für besonders sensible Dokumente.</p>

<h4>Teil 3: Was ein Corporate LLM bringt</h4>
<ul>
<li><b>Kontrolle:</b> Die Firma entscheidet, welche Modelle erlaubt sind und wer was darf.</li>
<li><b>Keine Schatten-KI:</b> Wer eine gute, erlaubte Lösung hat, braucht keine heimliche.</li>
<li><b>Gemeinsame Assistenten:</b> Vorgefertigte Assistenten für alle, z. B. „Angebotsschreiber“, „Protokollant“.</li>
<li><b>Firmenwissen:</b> Eingebaute RAG-Funktionen für interne Dokumente.</li>
<li><b>Kosten:</b> Bezahlt wird über die API nach Verbrauch, statt für jeden Mitarbeitenden ein eigenes Abo.</li>
<li><b>Protokollierung:</b> Nachvollziehbar, was genutzt wird (unter Beachtung des Datenschutzes der Mitarbeitenden).</li>
</ul>

<h4>Teil 4: Lokale KI genauer</h4>
<p><b>Ollama</b> ist ein Programm, mit dem du Open-Source-Modelle auf deinem eigenen Rechner oder Server ausführst. Ein Befehl lädt ein Modell herunter, danach läuft es komplett offline.</p>
<ul>
<li><b>Hardware:</b> Je größer das Modell, desto mehr Arbeitsspeicher und Grafikkarte. Kleine Modelle laufen auf einem guten Laptop, große brauchen teure Server.</li>
<li><b>Qualität:</b> Gute offene Modelle sind für Zusammenfassen, Einordnen und einfache Texte oft ausreichend, bei komplexem Denken aber meist hinter den besten Cloud-Modellen.</li>
<li><b>Einsatz:</b> Personalakten, Gesundheitsdaten, vertrauliche Verträge, Daten mit Geheimhaltungsvereinbarung.</li>
</ul>
<div class="ex"><b>Lokale Dokumentenanalyse:</b> Ein Orchesterbüro will 200 Bewerbungsmappen nach Kriterien vorsortieren lassen. Die Unterlagen enthalten sensible Personendaten. Lösung: lokales Modell auf einem Büro-Server, kein Internet nötig. Wichtig: Die finale Auswahl trifft ein Mensch, denn KI bei Personalentscheidungen ist nach dem EU AI Act ein Hochrisiko-Bereich.</div>

<h4>Teil 5: Einführung im Unternehmen</h4>
<ol>
<li><b>KI-Richtlinie</b> schreiben: Was ist erlaubt, was verboten, welche Daten dürfen hinein?</li>
<li><b>Lösung auswählen</b> (Cloud, EU-Cloud, lokal oder Mischung).</li>
<li><b>Verträge</b> prüfen: AVV, Serverstandort, keine Trainingsnutzung.</li>
<li><b>Schulen</b>: KI-Kompetenz ist nach dem AI Act ohnehin gefordert.</li>
<li><b>Mitarbeitervertretung</b> (Betriebs- oder Personalrat) früh einbinden.</li>
</ol>`,

<p>„Vertrieb“ klingt nach Verkäufern in Anzügen. Für Musiker, Ensembles und Selbstständige heißt es einfach: <b>Wie kommen Anfragen herein, und wie werden daraus Aufträge?</b> Viele Schritte dabei sind Routine, und genau dort hilft KI.</p>

<h4>Teil 1: Der Vertriebsprozess als Process Map</h4>
<div class="flow"><span>📩 Anfrage<small>Lead</small></span><i>→</i><span>🔎 Qualifizieren<small>passt das?</small></span><i>→</i><span>💶 Angebot</span><i>→</i><span>📞 Nachfassen</span><i>→</i><span>✍️ Zusage<small>Vertrag</small></span><i>→</i><span>📊 Auswerten</span></div>
<p>Ein <b>Lead</b> ist ein potenzieller Kunde, also eine Anfrage oder ein Kontakt, aus dem ein Auftrag werden könnte. Ein <b>CRM</b> (Customer Relationship Management) ist das System, in dem alle Leads und Kunden verwaltet werden. Das kann ein Profi-Tool sein (z. B. HubSpot, Pipedrive) oder für den Anfang eine gut gepflegte Tabelle.</p>

<h4>Teil 2: Lead-Qualifizierung</h4>
<p>Nicht jede Anfrage ist gleich viel wert. <b>Qualifizieren</b> heißt: einschätzen, wie gut eine Anfrage passt und wie dringend sie ist. KI kann das automatisch nach deinen Kriterien tun.</p>
<table>
<tr><th>Stufe</th><th>Kriterien (Beispiel Ensemble)</th><th>Was passiert</th></tr>
<tr><td>🔥 Heiß</td><td>Budget passt, Termin frei, alle Infos vollständig</td><td>Sofort Angebotsentwurf, Benachrichtigung</td></tr>
<tr><td>🌤️ Warm</td><td>Termin frei, Budget unklar oder Infos fehlen</td><td>Automatische freundliche Rückfrage</td></tr>
<tr><td>❄️ Kalt</td><td>Budget deutlich zu niedrig oder Termin belegt</td><td>Höfliche Absage oder Alternativvorschlag</td></tr>
</table>
<div class="tip">Lass die KI ihre Einstufung immer <b>begründen</b> („Heiß, weil …“). So erkennst du schnell, ob die Kriterien richtig angewendet werden.</div>

<h4>Teil 3: Automatisierte Angebote</h4>
<div class="ex"><b>Ablauf:</b>
<div class="flow"><span>📝 Formular<small>Datum, Ort, Anlass, Budget</small></span><i>→</i><span>📅 Kalender<small>frei?</small></span><i>→</i><span>🤖 KI<small>Programm + Preis nach Preisliste</small></span><i>→</i><span>📄 PDF<small>aus Vorlage</small></span><i>→</i><span>👤 Freigabe<small>Mensch</small></span><i>→</i><span>📧 Versand</span></div></div>
<p>Wichtige Regeln:</p>
<ul>
<li><b>Preise kommen aus deiner Preisliste</b>, nicht aus dem „Gefühl“ der KI. Die Preisliste wird mitgegeben oder per Tabelle nachgeschlagen.</li>
<li><b>Die Vorlage bleibt fix</b>: Logo, Rechtliches, Zahlungsbedingungen. Die KI füllt nur die variablen Teile.</li>
<li><b>Freigabe vor Versand</b>, zumindest am Anfang. Wenn es 50-mal fehlerfrei lief, kann man über Lockerung nachdenken.</li>
</ul>

<h4>Teil 4: Nachfassen (Follow-up)</h4>
<p>Viele Aufträge gehen verloren, weil niemand nachfasst. Eine Automation erinnert dich nach z. B. 5 Tagen ohne Antwort und legt einen <b>persönlichen</b> Nachfass-Entwurf bereit, der sich auf die ursprüngliche Anfrage bezieht.</p>

<h4>Teil 5: Outbound, also aktiv auf andere zugehen</h4>
<p><b>Inbound</b> = Kunden kommen zu dir. <b>Outbound</b> = du gehst auf mögliche Kunden zu. KI hilft beim Recherchieren (Welche Festivals passen zu uns?) und beim Personalisieren (Bezug auf die letzte Saison des Veranstalters).</p>
